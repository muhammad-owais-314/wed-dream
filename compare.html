<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compare | WeDream</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --gold: #c89b2c;
      --gold-light: #e8b93c;
      --gold-dark: #8a691a;
      --rose: #b93b56;
      --dark: #0a0708;
      --glass: rgba(14, 11, 12, 0.85);
    }
    body {
      background: var(--dark);
      font-family: "Jost", sans-serif;
      color: #f0ede8;
      overflow-x: hidden;
    }
    ::selection {
      background: var(--gold);
      color: #0b0708;
    }
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #100b0d;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 5px;
    }

    .cmp-section {
      padding: 130px 24px 80px;
      background: radial-gradient(circle at 10% 20%, #110c0e 0%, #050303 100%);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .cmp-section::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(200, 155, 44, 0.03), transparent 60%);
      pointer-events: none;
      animation: bgPulse 8s ease-in-out infinite;
    }
    @keyframes bgPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .cmp-head {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }
    .cmp-accent {
      height: 2px;
      width: 120px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), transparent);
      margin: 0 auto 14px;
      border-radius: 2px;
    }
    .cmp-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 3.2rem;
      color: #fff;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 40px rgba(200, 155, 44, 0.1);
    }
    .cmp-title span {
      color: var(--gold);
      font-style: italic;
      position: relative;
    }
    .cmp-title span::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
    }
    .cmp-sub {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
      font-weight: 300;
    }

    /* ===== CATEGORY TABS ===== */
    .cat-tabs {
      max-width: 1100px;
      margin: 0 auto 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .cat-tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: rgba(20, 15, 17, 0.65);
      border: 1px solid rgba(200, 155, 44, 0.22);
      color: rgba(255, 255, 255, 0.7);
      padding: 11px 20px;
      border-radius: 14px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
      font-family: "Jost", sans-serif;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }
    .cat-tab i {
      color: var(--gold);
      transition: color 0.3s;
    }
    .cat-tab:hover {
      color: #fff;
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(200, 155, 44, 0.08);
    }
    .cat-tab.active {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #0b0708;
      border-color: transparent;
      box-shadow: 0 8px 30px rgba(200, 155, 44, 0.3);
      transform: translateY(-2px);
    }
    .cat-tab.active i {
      color: #0b0708;
    }
    .cat-tab .tab-count {
      background: rgba(0, 0, 0, 0.3);
      color: inherit;
      font-size: 0.7rem;
      padding: 1px 8px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
      transition: all 0.3s;
    }
    .cat-tab.active .tab-count {
      background: rgba(0, 0, 0, 0.2);
    }
    .cat-tab:not(.active) .tab-count {
      background: var(--rose);
      color: #fff;
    }
    .cat-tab:not(.active) .tab-count:empty,
    .cat-tab .tab-count.zero {
      display: none;
    }
    .cat-tab .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      display: none;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .cat-tab .pulse-dot.show {
      display: inline-block;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* ===== BOARD ===== */
    .cmp-board {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--glass);
      border: 1px solid rgba(200, 155, 44, 0.2);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cmp-empty {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.55);
    }
    .cmp-empty i {
      font-size: 3.5rem;
      color: var(--gold);
      opacity: 0.4;
      margin-bottom: 18px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .cmp-empty h3 {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 8px;
    }
    .cmp-empty a {
      display: inline-block;
      margin-top: 18px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #0b0708;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .cmp-empty a:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 30px rgba(200, 155, 44, 0.3);
    }

    .cmp-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .cmp-toolbar h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.8rem;
      color: var(--gold-light);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cmp-toolbar h2 small {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 1px;
    }
    .cmp-clear {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.6);
      padding: 9px 18px;
      border-radius: 12px;
      font-size: 0.74rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      font-family: "Jost", sans-serif;
    }
    .cmp-clear:hover {
      background: rgba(185, 59, 86, 0.15);
      border-color: var(--rose);
      color: #fff;
      transform: translateY(-2px);
    }

    /* ===== TABLE ===== */
    .cmp-table-wrap {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid rgba(200, 155, 44, 0.1);
    }
    .cmp-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }
    .cmp-table th,
    .cmp-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      vertical-align: middle;
      font-size: 0.86rem;
      transition: background 0.3s;
    }
    .cmp-table thead th {
      background: rgba(200, 155, 44, 0.06);
      color: var(--gold-light);
      font-family: "Cormorant Garamond", serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: none;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .cmp-table thead th:first-child {
      color: var(--gold);
      font-size: 0.7rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    .cmp-table tbody th {
      background: rgba(11, 7, 8, 0.4);
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      font-size: 0.7rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      width: 170px;
      border-right: 1px solid rgba(200, 155, 44, 0.05);
    }
    .cmp-table tbody tr:hover td {
      background: rgba(200, 155, 44, 0.03);
    }
    .cmp-table td.yes {
      color: #4ade80;
    }
    .cmp-table td.no {
      color: #f87171;
    }
    .cmp-table td.winner {
      position: relative;
    }
    .cmp-table td.winner::after {
      content: '👑 WINNER';
      position: absolute;
      top: -8px;
      right: 8px;
      font-size: 0.55rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #0b0708;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      animation: glowPulse 2s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(200, 155, 44, 0.3); }
      50% { box-shadow: 0 0 25px rgba(200, 155, 44, 0.6); }
    }
    .cmp-table td.winner-glow {
      background: rgba(200, 155, 44, 0.08) !important;
      border-left: 2px solid var(--gold);
    }

    /* ===== THUMB ===== */
    .cmp-thumb {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      position: relative;
    }
    .cmp-thumb .winner-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #0b0708;
      font-size: 0.55rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(200, 155, 44, 0.4);
      animation: glowPulse 2s ease-in-out infinite;
    }
    .cmp-thumb img {
      width: 100%;
      max-width: 160px;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(200, 155, 44, 0.2);
      transition: all 0.4s;
    }
    .cmp-thumb img:hover {
      transform: scale(1.03);
      border-color: var(--gold);
    }
    .cmp-thumb .rm {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.7rem;
      cursor: pointer;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: all 0.3s;
      font-family: "Jost", sans-serif;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .cmp-thumb .rm:hover {
      color: var(--rose);
      background: rgba(185, 59, 86, 0.1);
    }
    .cmp-thumb .rm i {
      margin-right: 4px;
    }
    .cmp-thumb .name {
      color: #fff;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .cmp-thumb .rating-badge {
      font-size: 0.75rem;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .cmp-title {
        font-size: 2.2rem;
      }
      .cmp-section {
        padding: 110px 14px 60px;
      }
      .cmp-board {
        padding: 16px;
      }
      .cmp-table {
        min-width: 500px;
      }
      .cmp-table thead th {
        font-size: 0.9rem;
        padding: 10px 12px;
      }
      .cmp-table th,
      .cmp-table td {
        padding: 10px 12px;
        font-size: 0.78rem;
      }
      .cmp-thumb img {
        max-width: 120px;
      }
      .cmp-toolbar h2 {
        font-size: 1.4rem;
      }
      .cmp-tab {
        padding: 8px 14px;
        font-size: 0.7rem;
      }
      .cmp-empty h3 {
        font-size: 1.4rem;
      }
    }
    @media (max-width: 480px) {
      .cmp-thumb img {
        max-width: 90px;
      }
      .cmp-table {
        min-width: 400px;
      }
      .cmp-table th,
      .cmp-table td {
        padding: 8px 10px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <div id="nav-container"></div>

  <section class="cmp-section">
    <div class="cmp-head">
      <div class="cmp-accent"></div>
      <h1 class="cmp-title">Smart <span>Compare</span></h1>
      <p class="cmp-sub">Side-by-side comparison across all wedding services</p>
    </div>

    <div class="cat-tabs" id="catTabs"></div>

    <div class="cmp-board" id="cmpBoard"></div>
  </section>

  <div id="footer-container"></div>

  <script>
    $(document).ready(function() {
      $.get("navebar.html", function(d) {
        $("#nav-container").html(d);
        $(".wd-menu-link").removeClass("active");
        $('.wd-menu-link[data-nav="vendors"]').addClass("active");
      });
      $.get("footer.html", function(d) {
        $("#footer-container").html(d);
      });
    });

    // ============================================
    // CATEGORY CONFIG (CORRECT FILE NAMES)
    // ============================================
    const CATS = [{
      key: "halls",
      label: "Halls",
      icon: "fa-building-columns",
      file: "hallsDetails.json",
      storage: "cmp_halls",
      link: "halls.html",
      fields: [
        { k: "area", l: "Area" },
        { k: "rating", l: "Rating", fmt: (v) => "⭐ " + v },
        { k: "starting_price", l: "Starting Price", fmt: (v) => "PKR " + (v || 0).toLocaleString() },
        { k: "capacity", l: "Capacity" },
        { k: "parking", l: "Parking", bool: true },
        { k: "ac", l: "Air Conditioned", bool: true },
        { k: "catering", l: "In-house Catering", bool: true },
        { k: "outdoor", l: "Outdoor Space", bool: true },
        { k: "stage", l: "Stage Setup", bool: true }
      ]
    }, {
      key: "catering",
      label: "Catering",
      icon: "fa-utensils",
      file: "caterers.json",
      storage: "cmp_caterers",
      link: "catering.html",
      fields: [
        { k: "area", l: "Area" },
        { k: "rating", l: "Rating", fmt: (v) => "⭐ " + v },
        { k: "starting_price", l: "Starting Price", fmt: (v) => "PKR " + (v || 0).toLocaleString() },
        { k: "cuisine_types", l: "Cuisine", fmt: (v) => Array.isArray(v) ? v.slice(0, 3).join(", ") : (v || "-") },
        { k: "features", l: "Features", fmt: (v) => Array.isArray(v) ? v.slice(0, 3).join(", ") : (v || "-") },
        { k: "verified", l: "Verified", bool: true },
        { k: "halal", l: "Halal Certified", bool: true }
      ]
    }, {
      key: "photographers",
      label: "Photographers",
      icon: "fa-camera-retro",
      file: "photographers.json",
      storage: "cmp_photographers",
      link: "photographers.html",
      fields: [
        { k: "area", l: "Area" },
        { k: "rating", l: "Rating", fmt: (v) => "⭐ " + v },
        { k: "starting_price", l: "Package From", fmt: (v) => "PKR " + (v || 0).toLocaleString() },
        { k: "services", l: "Services", fmt: (v) => Array.isArray(v) ? v.slice(0, 3).join(", ") : (v || "-") },
        { k: "verified", l: "Verified", bool: true }
      ]
    }, {
      key: "carrentals",
      label: "Car Rentals",
      icon: "fa-car",
      file: "carrentals.json",
      storage: "cmp_carrentals",
      link: "carrentals.html",
      fields: [
        { k: "area", l: "Area" },
        { k: "rating", l: "Rating", fmt: (v) => "⭐ " + v },
        { k: "starting_price", l: "Per Day", fmt: (v) => "PKR " + (v || 0).toLocaleString() },
        { k: "fleet", l: "Fleet", fmt: (v) => Array.isArray(v) ? v.slice(0, 3).join(", ") : (v || "-") },
        { k: "verified", l: "Verified", bool: true }
      ]
    }, {
      key: "decorators",
      label: "Decorators",
      icon: "fa-wand-magic-sparkles",
      file: "decorators.json",
      storage: "cmp_decorators",
      link: "decorating.html",
      fields: [
        { k: "area", l: "Area" },
        { k: "rating", l: "Rating", fmt: (v) => "⭐ " + v },
        { k: "starting_price", l: "Setup From", fmt: (v) => "PKR " + (v || 0).toLocaleString() },
        { k: "style", l: "Style" },
        { k: "verified", l: "Verified", bool: true }
      ]
    }];

    const fallback = "https://images.pexels.com/photos/265947/pexels-photo-265947.jpeg?auto=compress&cs=tinysrgb&w=500";
    let activeCat = localStorage.getItem("cmp_active_cat") || "halls";
    const dataCache = {};

    // ============================================
    // GET COUNTS
    // ============================================
    function counts() {
      const o = {};
      CATS.forEach((c) => {
        try {
          o[c.key] = JSON.parse(localStorage.getItem(c.storage) || "[]").length;
        } catch {
          o[c.key] = 0;
        }
      });
      return o;
    }

    // ============================================
    // RENDER TABS
    // ============================================
    function renderTabs() {
      const c = counts();
      const total = Object.values(c).reduce((a, b) => a + b, 0);
      document.getElementById("catTabs").innerHTML = CATS.map(
        (cat) => `
      <button class="cat-tab ${cat.key === activeCat ? "active" : ""}" data-key="${cat.key}">
        <i class="fa-solid ${cat.icon}"></i> ${cat.label}
        <span class="tab-count ${c[cat.key] ? "" : "zero"}">${c[cat.key] || ""}</span>
        <span class="pulse-dot ${c[cat.key] ? "show" : ""}"></span>
      </button>`
      ).join("");
      document.querySelectorAll(".cat-tab").forEach(
        (t) =>
        (t.onclick = () => {
          activeCat = t.dataset.key;
          localStorage.setItem("cmp_active_cat", activeCat);
          renderTabs();
          loadAndRender();
        })
      );
    }

    // ============================================
    // LOAD & RENDER
    // ============================================
    function loadAndRender() {
      const cat = CATS.find((c) => c.key === activeCat);
      if (!cat) return;
      const ids = JSON.parse(localStorage.getItem(cat.storage) || "[]");
      if (!ids.length) {
        renderEmpty(cat);
        return;
      }
      if (dataCache[cat.key]) return renderBoard(cat, ids, dataCache[cat.key]);
      fetch(cat.file)
        .then((r) => (r.ok ? r.json() : []))
        .then((d) => {
          dataCache[cat.key] = d;
          renderBoard(cat, ids, d);
        })
        .catch(() => {
          dataCache[cat.key] = [];
          renderBoard(cat, ids, []);
        });
    }

    // ============================================
    // RENDER EMPTY
    // ============================================
    function renderEmpty(cat) {
      document.getElementById("cmpBoard").innerHTML = `
      <div class="cmp-empty">
        <i class="fa-solid ${cat.icon}"></i>
        <h3>No ${cat.label} Selected</h3>
        <p>Go to <strong style="color:var(--gold-light)">${cat.label}</strong> page and tap the compare icon on any card to add items here.</p>
        <a href="${cat.link}"><i class="fa-solid fa-arrow-right me-2"></i>Browse ${cat.label}</a>
      </div>`;
    }

    // ============================================
    // RENDER BOARD
    // ============================================
    function renderBoard(cat, ids, data) {
      const items = ids.map((id) => data.find((x) => x.id === id)).filter(Boolean);
      if (!items.length) {
        renderEmpty(cat);
        return;
      }

      // Find winner (highest rating)
      const winner = items.reduce((a, b) => (a.rating || 0) > (b.rating || 0) ? a : b);

      const f = (v, isWinner = false) => {
        let cls = isWinner ? 'winner-glow' : '';
        if (v === true || v === "true") return `<td class="yes ${cls}"><i class="fa-solid fa-check-circle"></i> Yes</td>`;
        if (v === false || v === "false") return `<td class="no ${cls}"><i class="fa-solid fa-xmark-circle"></i> No</td>`;
        return `<td class="${cls}">${v}</td>`;
      };

      const rows = cat.fields
        .map((field) => {
          const cells = items
            .map((it) => {
              const v = it[field.k];
              const isWinner = it.id === winner.id;
              if (field.bool) return f(v, isWinner);
              const out = field.fmt ? field.fmt(v) : (v ?? "-");
              return `<td class="${isWinner ? 'winner-glow' : ''}">${out}</td>`;
            })
            .join("");
          return `<tr><th>${field.l}</th>${cells}</tr>`;
        })
        .join("");

      const headers = items
        .map((it) => {
          const isWinner = it.id === winner.id;
          return `
      <th class="${isWinner ? 'winner-glow' : ''}">
        <div class="cmp-thumb">
          <img src="${it.image || fallback}" alt="${it.name}" onerror="this.src='${fallback}'">
          ${isWinner ? `<span class="winner-badge"><i class="fa-solid fa-crown"></i> WINNER</span>` : ''}
          <span class="name">${it.name}</span>
          <span class="rating-badge"><i class="fa-solid fa-star" style="color:var(--gold)"></i> ${it.rating || '-'}</span>
          <button class="rm" data-rm="${it.id}"><i class="fa-solid fa-xmark"></i> Remove</button>
        </div>
      </th>`;
        })
        .join("");

      document.getElementById("cmpBoard").innerHTML = `
      <div class="cmp-toolbar">
        <h2>${cat.label} <small>${items.length} item${items.length > 1 ? 's' : ''}</small></h2>
        <button class="cmp-clear" id="clearCat"><i class="fa-solid fa-trash me-2"></i>Clear All</button>
      </div>
      <div class="cmp-table-wrap">
        <table class="cmp-table">
          <thead><tr><th>Features</th>${headers}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;">
        <span style="font-size:0.7rem;color:rgba(255,255,255,0.3);display:flex;align-items:center;gap:6px;">
          <span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:rgba(200,155,44,0.15);border:1px solid var(--gold);"></span>
          <span style="color:var(--gold-light);font-weight:600;">👑 Winner</span> — Highest rated item
        </span>
      </div>`;

      document.getElementById("clearCat").onclick = () => {
        localStorage.setItem(cat.storage, "[]");
        renderTabs();
        loadAndRender();
      };

      document.querySelectorAll(".rm").forEach(
        (b) =>
        (b.onclick = () => {
          const id = +b.dataset.rm;
          const arr = JSON.parse(localStorage.getItem(cat.storage) || "[]").filter((x) => x !== id);
          localStorage.setItem(cat.storage, JSON.stringify(arr));
          renderTabs();
          loadAndRender();
        })
      );
    }

    // ============================================
    // INIT
    // ============================================
    renderTabs();
    loadAndRender();
  </script>
</body>
</html>
