<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>

:root{
  --gold:#c89b2c;
   --rose:#b93b56;
  --black:#000;
  --white:#fff;

  --nav-font:'Josefin Sans', sans-serif;
  --logo-font:'Cormorant Garamond', serif;
}

/* =========================
   GLOBAL
========================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#0a0a0a;
  font-family:var(--nav-font);
  overflow-x:hidden;
}

/* =========================
   NAVBAR
========================= */
.custom-navbar{
  width:100%;
  height:78px;

  background:rgba(0,0,0,0.96);

  border-bottom:1px solid rgba(200,155,44,0.4);

  backdrop-filter:blur(12px);

  position:sticky;
  top:0;
  left:0;

  z-index:9999;

  display:flex;
  align-items:center;
}

/* Container */
.nav-container{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 55px;
}

/* =========================
   LOGO
========================= */
.logo{
  display:flex;
  align-items:center;
  text-decoration:none;
  flex-shrink:0;
}

.logo img{
  width:200px;
  max-width:100%;
  object-fit:contain;
}

/* =========================
   DESKTOP MENU
========================= */
.nav-menu{
  display:flex;
  align-items:center;
  gap:8px;
  padding-top: 20px;

  list-style:none;
}

/* Nav Item */
.nav-item{
  position:relative;
}

/* Links */
.nav-link{
  position:relative;

  display:flex;
  align-items:center;
  gap:7px;

  color:#fff;
  text-decoration:none;

  padding:10px 16px;

  font-size:13px;
  font-weight:600;

  letter-spacing:2px;
  text-transform:uppercase;

  transition:0.3s;
}

/* Hover */
.nav-link:hover{
  color:var(--rose);
}

/* Active */
.nav-link.active-link{
  color:var(--rose);
}

/* Underline effect */
.nav-link::after{
  content:"";

  position:absolute;
  bottom:0;
  left:15px;

  width:0;
  height:1px;

  background:var(--rose);

  transition:0.35s;
}

.nav-link:hover::after,
.nav-link.active-link::after{
  width:60%;
}

/* Arrow */
.arrow{
  font-size:9px;
  transition:0.35s;
}

/* Rotate Arrow */
.nav-item.open .arrow{
  transform:rotate(180deg);
}

/* =========================
   DROPDOWN
========================= */
.dropdown-menu{
  position:absolute;

  top:calc(100% + 16px);
  left:0;

  min-width:220px;

  background:#0d0d0d;

  border:1px solid rgba(255,255,255,0.06);
  border-top:2px solid var(--gold);

  border-radius:12px;

  padding:10px 0;

  list-style:none;

  opacity:0;
  visibility:hidden;

  transform:translateY(10px);

  transition:0.3s;

  z-index:999;
}

/* Open */
.nav-item.open .dropdown-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* Dropdown Links */
.dropdown-menu li a{
  display:block;

  color:#bbb;
  text-decoration:none;

  padding:13px 22px;

  font-size:12px;
  letter-spacing:1.5px;

  text-transform:uppercase;

  transition:0.3s;
}

/* Hover */
.dropdown-menu li a:hover{
  background:#161616;
  color:var(--gold);

  padding-left:30px;
}

/* =========================
   AI BUTTON
========================= */
.ai-link{
  background:linear-gradient(135deg,#250014,#3f0026);

  border:1px solid rgba(255,0,127,0.5);

  border-radius:30px;

  color:var(--rose) !important;

  padding:10px 18px !important;
}

.ai-link:hover{
  background:var(--rose);
  color:#fff !important;
}

/* Remove underline */
.ai-link::after{
  display:none;
}

/* =========================
   ICONS
========================= */
.nav-icons{
  display:flex;
  align-items:center;
  gap:22px;
}

.nav-icons a{
  color:#fff;

  font-size:18px;

  transition:0.3s;

  text-decoration:none;
}

.nav-icons a:hover{
  color:var(--rose);
  transform:translateY(-2px);
}

/* =========================
   HAMBURGER
========================= */
.hamburger-btn{
  width:52px;
  height:52px;

  border:none;
  outline:none;

  background:rgba(255,255,255,0.04);

  border:1px solid rgba(255,255,255,0.08);

  border-radius:14px;

  display:none;

  align-items:center;
  justify-content:center;

  cursor:pointer;

  position:relative;

  overflow:hidden;

  transition:0.3s;

  z-index:10000;
}

/* Hover */
.hamburger-btn:hover{
  border-color:rgba(255,0,127,0.5);
  background:rgba(255,0,127,0.08);
}

/* Icon Box */
.h-icon{
  width:24px;
  height:18px;

  position:relative;
}

/* Bars */
.bar{
  position:absolute;

  width:100%;
  height:2px;

  background:#fff;

  border-radius:10px;

  transition:0.4s;
}

.bar:nth-child(1){
  top:0;
}

.bar:nth-child(2){
  top:8px;
  width:70%;
  right:0;
}

.bar:nth-child(3){
  top:16px;
}

/* Open Animation */
.hamburger-btn.open .bar:nth-child(1){
  transform:rotate(45deg);
  top:8px;

  background:var(--rose);
}

.hamburger-btn.open .bar:nth-child(2){
  opacity:0;
}

.hamburger-btn.open .bar:nth-child(3){
  transform:rotate(-45deg);
  top:8px;

  background:var(--rose);
}

/* =========================
   MOBILE MENU
========================= */
.mobile-menu{
  position:fixed;

  top:78px;
  right:-100%;

  width:100%;
  height:calc(100vh - 78px);

  background:#050505;

  z-index:9998;

  transition:0.45s ease;

  overflow-y:auto;

  padding:20px 0 40px;
}

/* Open */
.mobile-menu.open{
  right:0;
}

/* Menu List */
.mobile-menu ul{
  list-style:none;
  padding:0 24px;
}

/* List */
.mobile-menu ul li{
  border-bottom:1px solid rgba(255,255,255,0.06);
}

/* Mobile Links */
.mobile-menu ul li a{
  display:flex;
  align-items:center;
  justify-content:space-between;

  color:#ddd;
  text-decoration:none;

  padding:18px 0;

  font-size:14px;
  font-weight:500;

  letter-spacing:2px;
  text-transform:uppercase;

  transition:0.3s;
}

.mobile-menu ul li a:hover{
  color:var(--rose);
}

/* Active */
.mobile-menu ul li a.active-link{
  color:var(--rose);
}

/* =========================
   MOBILE SUB MENU
========================= */
.mobile-sub{
  display:none;

  padding-left:18px;
  padding-bottom:10px;
}

/* Open */
.mobile-sub.open{
  display:block;
}

/* Remove Border */
.mobile-sub li{
  border:none !important;
}

/* Sub Links */
.mobile-sub li a{
  color:#777 !important;

  font-size:11px !important;

  padding:10px 0 !important;

  letter-spacing:1.5px !important;
}

/* Hover */
.mobile-sub li a:hover{
  color:var(--gold) !important;
}

/* =========================
   MOBILE ICONS
========================= */
.mobile-icons{
  display:flex;
  align-items:center;
  gap:26px;

  padding:30px 24px 0;
}

.mobile-icons a{
  color:#fff;
  font-size:20px;

  transition:0.3s;
}

.mobile-icons a:hover{
  color:var(--rose);
}

/* =========================
   LARGE LAPTOP
========================= */
@media(max-width:1200px){

  .nav-container{
    padding:0 30px;
  }

  .nav-link{
    padding:10px 12px;
    font-size:12px;
  }

}

/* =========================
   TABLET
========================= */
@media(max-width:991px){

  /* Hide Desktop */
  .nav-menu,
  .nav-icons{
    display:none;
  }

  /* Show Hamburger */
  .hamburger-btn{
    display:flex;
  }

  /* Navbar */
  .custom-navbar{
    height:74px;
  }

  .nav-container{
    padding:0 24px;
  }

  /* Logo */
  .logo img{
    width:170px;
  }

  /* Mobile Menu */
  .mobile-menu{
    top:74px;
    height:calc(100vh - 74px);
  }

}

/* =========================
   MOBILE
========================= */
@media(max-width:576px){

  .custom-navbar{
    height:70px;
  }

  .nav-container{
    padding:0 18px;
  }

  .logo img{
    width:145px;
  }

  .hamburger-btn{
    width:48px;
    height:48px;
  }

  .mobile-menu{
    top:70px;
    height:calc(100vh - 70px);
  }

  .mobile-menu ul{
    padding:0 18px;
  }

  .mobile-menu ul li a{
    font-size:13px;
  }

}

</style>

      <li class="nav-item">

<!-- ================= MOBILE MENU ================= -->

<div class="mobile-menu" id="mobileMenu">

  <ul>

    <li>
      <a href="#" class="active-link">Home</a>
    </li>

    <li>
      <a href="#">About Us</a>
    </li>

    <!-- Services -->
    <li>

      <a href="#" class="mobile-toggle-sub" data-target="sub-services">

        Services

        <i class="fa-solid fa-chevron-down"
        style="font-size:10px; transition:0.3s;"></i>

      </a>

      <ul class="mobile-sub" id="sub-services">

<!-- ================= JAVASCRIPT ================= -->

<script>

  // ================= MOBILE MENU =================

  const btn = document.getElementById('hamburgerBtn');
  const menu = document.getElementById('mobileMenu');

  btn.addEventListener('click', () => {

    btn.classList.toggle('open');
    menu.classList.toggle('open');

  });


  // ================= MOBILE SUB MENU =================

  document.querySelectorAll('.mobile-toggle-sub').forEach(link => {

    link.addEventListener('click', (e) => {

      e.preventDefault();

      const target = document.getElementById(
        link.getAttribute('data-target')
      );

      target.classList.toggle('open');

      const icon = link.querySelector('i');

      icon.style.transform =
      target.classList.contains('open')
      ? 'rotate(180deg)'
      : 'rotate(0deg)';

    });

  });


  // ================= DESKTOP DROPDOWN =================

  const dropdownBtns = document.querySelectorAll('.dropdown-toggle-btn');

  dropdownBtns.forEach(btn => {

    btn.addEventListener('click', function(e){

      e.preventDefault();

      const parent = this.parentElement;

      // close others

      document.querySelectorAll('.nav-item').forEach(item => {

        if(item !== parent){
          item.classList.remove('open');
        }

      });

      // toggle current

      parent.classList.toggle('open');

    });

  });


  // ================= OUTSIDE CLICK CLOSE =================

  document.addEventListener('click', function(e){

    if(!e.target.closest('.nav-item')){

      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('open');
      });

    }

  });


  // ================= ACTIVE LINK =================

  const navLinks = document.querySelectorAll('.nav-link');

  navLinks.forEach(link => {

    link.addEventListener('click', function(){

      navLinks.forEach(nav => {
        nav.classList.remove('active-link');
      });

      this.classList.add('active-link');

    });

  });

</script>
