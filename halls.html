<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeDream</title>
<link rel="stylesheet" href="style2.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

<body>

<!-- NAVBAR -->
<div id="nav-container"></div>

<!-- Premium Halls Showcase -->
<div class="premium-halls-section">
    <div class="premium-section-accent"></div>
    <h2 class="section-title-premium">The Grandeur <span>Collection</span></h2>
    <p class="section-sub">Curated venues for royalty &amp; grand celebrations</p>

    <!-- FILTER BAR -->
    <div id="filterBar" class="filter-bar"></div>

    <div class="container">
        <div class="row g-3" id="productContainer">
            <!-- cards yahan JS inject karega -->
        </div>
        <!-- no results message -->
        <p id="noResults" class="no-results">Koi hall nahi mila is area mein.</p>
    </div>
</div>

<!-- FOOTER -->
<div id="footer-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
