<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Decorators | WeDream</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: #0a0708;
        font-family: 'Jost', sans-serif;
        overflow-x: hidden;
    }

    :root {
        --rose: #b93b56;
        --rose-hover: #a22f49;
        --gold: #c89b2c;
        --gold-light: #e8b93c;
        --white: #ffffff;
        --dark-bg: #0e0b0c;
        --card-glass: rgba(18, 14, 16, 0.75);
        --border-glow: rgba(200, 155, 44, 0.35);
    }

    .premium-decorators-section {
        padding: 70px 24px 90px;
        background: radial-gradient(circle at 10% 20%, #110c0e 0%, #050303 100%);
        position: relative;
    }

    .premium-section-accent {
        height: 2px;
        width: 120px;
        background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), transparent);
        margin: 0 auto 16px auto;
    }

    .section-title-premium {
        text-align: center;
        font-family: 'Cormorant Garamond', serif;
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 2px;
        color: #fff;
        margin-bottom: 10px;
    }
    .section-title-premium span { color: var(--gold); font-style: italic; }

    .section-sub {
        text-align: center;
        color: rgba(255,255,255,0.6);
        font-size: 0.85rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 36px;
    }

    .filter-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 48px;
    }
    .filter-btn {
        background: transparent;
        border: 1.2px solid rgba(200, 155, 44, 0.4);
        color: rgba(255,255,255,0.65);
        font-family: 'Jost', sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        padding: 8px 20px;
        border-radius: 40px;
        cursor: pointer;
        transition: all 0.28s ease;
    }
    .filter-btn:hover { border-color: var(--gold); color: var(--gold-light); background: rgba(200,155,44,0.08); }
    .filter-btn.active {
        background: var(--gold);
        border-color: var(--gold);
        color: #0e0b0c;
        font-weight: 800;
        box-shadow: 0 4px 16px rgba(200,155,44,0.3);
    }

    .no-results {
        text-align: center;
        color: rgba(255,255,255,0.35);
        font-size: 1rem;
        letter-spacing: 1px;
        padding: 60px 0;
        display: none;
        width: 100%;
    }

    .premium-card-wrapper {
        margin-bottom: 28px;
        transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        height: 100%;
    }
    .premium-card-wrapper:hover { transform: translateY(-7px); }
    .premium-card {
        background: rgba(20, 16, 18, 0.85);
        backdrop-filter: blur(2px);
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid rgba(200, 155, 44, 0.3);
        box-shadow: 0 25px 40px -12px rgba(0,0,0,0.7), 0 0 0 0.5px rgba(200,155,44,0.15) inset;
        transition: all 0.3s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
    }
    .premium-card:hover {
        border-color: rgba(200, 155, 44, 0.7);
        box-shadow: 0 30px 50px -18px black, 0 0 0 2px rgba(200,155,44,0.2) inset;
        background: rgba(24, 19, 21, 0.9);
    }

    .card-img-container {
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid rgba(200,155,44,0.4);
    }
    .card-img-container img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        transition: transform 0.7s ease;
        display: block;
        background: linear-gradient(135deg, #1a1012 0%, #2a1a20 40%, #1e160d 70%, #120d0e 100%);
    }
    .premium-card:hover .card-img-container img { transform: scale(1.04); }
    .img-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.08) 60%);
        pointer-events: none;
    }

    .premium-badge {
        position: absolute;
        top: 14px;
        left: 14px;
        background: linear-gradient(125deg, #c89b2c 0%, #d9aa3a 100%);
        color: #0e0b0c;
        font-size: 0.65rem;
        font-weight: 800;
        letter-spacing: 1.2px;
        padding: 5px 12px;
        border-radius: 30px;
        box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        font-family: 'Jost', sans-serif;
        z-index: 3;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .premium-badge i { font-size: 0.65rem; }

    /* ── COMPARE BUTTON ── */
    .compare-card-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 4px 11px;
        background: rgba(7,7,7,0.82);
        border: 1px solid rgba(200,155,44,0.4);
        border-radius: 40px;
        color: var(--gold);
        font-family: 'Jost', sans-serif;
        font-size: 0.6rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: all 0.22s;
        z-index: 4;
        backdrop-filter: blur(8px);
    }
    .compare-card-btn:hover { background: var(--gold); color: #0e0b0c; border-color: transparent; }
    .compare-card-btn.added { background: var(--rose); color: #fff; border-color: transparent; }

    /* ── TOAST ── */
    #wd-compare-toast {
        position: fixed;
        bottom: 1.8rem;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: rgba(14,11,12,0.97);
        border: 1px solid rgba(200,155,44,0.45);
        backdrop-filter: blur(14px);
        border-radius: 50px;
        padding: 0.65rem 1.6rem;
        color: #e8b93c;
        font-family: 'Jost', sans-serif;
        font-size: 0.78rem;
        font-weight: 500;
        z-index: 9999;
        transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
        white-space: nowrap;
        pointer-events: none;
    }
    #wd-compare-toast.show { transform: translateX(-50%) translateY(0); }
    #wd-compare-toast.error-toast { border-color: rgba(185,59,86,0.5); color: #f87171; }

    .card-body-custom {
        padding: 1.1rem 1.2rem 1.3rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .decorator-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: #f5efdf;
        margin-bottom: 4px;
        letter-spacing: -0.3px;
        line-height: 1.2;
    }

    .location-text {
        display: flex;
        align-items: center;
        gap: 6px;
        color: rgba(255,255,255,0.6);
        font-size: 0.78rem;
        margin-bottom: 10px;
    }
    .location-text i { color: var(--gold); font-size: 0.72rem; }

    .rating-wrapper { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
    .stars { color: var(--gold); font-size: 0.75rem; letter-spacing: 1px; }
    .stars i { margin-right: 1px; }

    .rating-number {
        font-weight: 700;
        color: #fff;
        font-size: 0.82rem;
        background: rgba(200,155,44,0.18);
        padding: 2px 8px;
        border-radius: 40px;
    }

    .gold-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), transparent);
        margin: 8px 0 12px 0;
        opacity: 0.65;
    }

    .price-section {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
    }

    .d-flex-price { display: flex; align-items: baseline; gap: 3px; }
    .price-pkr { font-size: 0.68rem; font-weight: 500; color: var(--gold-light); letter-spacing: 1px; }

    .price-amount {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.7rem;
        font-weight: 800;
        color: #f5e2b0;
        line-height: 1;
    }

    .price-type { font-size: 0.68rem; color: rgba(255,255,255,0.45); margin-left: 2px; }

    .btn-view-details {
        background: transparent;
        border: 1.2px solid rgba(200,155,44,0.65);
        padding: 7px 16px;
        border-radius: 40px;
        color: var(--gold-light);
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
    }
    .btn-view-details i { font-size: 0.68rem; transition: transform 0.2s; }
    .btn-view-details:hover {
        background: var(--gold);
        border-color: var(--gold);
        color: #0e0b0c;
        box-shadow: 0 5px 14px rgba(200,155,44,0.3);
        transform: translateY(-2px);
    }
    .btn-view-details:hover i { transform: translateX(4px); color: #0e0b0c; }

    /* ── FLOATING COMPARE BAR ── */
    #wd-compare-bar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(14,11,12,0.97);
        border-top: 1px solid rgba(200,155,44,0.35);
        backdrop-filter: blur(16px);
        padding: 10px 20px;
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        z-index: 9998;
        flex-wrap: wrap;
    }
    #wd-compare-bar.visible { display: flex; }
    .compare-bar-items {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .compare-bar-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(200,155,44,0.1);
        border: 1px solid rgba(200,155,44,0.3);
        border-radius: 40px;
        padding: 4px 12px 4px 8px;
        font-family: 'Jost', sans-serif;
        font-size: 0.72rem;
        color: #e8b93c;
    }
    .compare-bar-chip button {
        background: none; border: none;
        color: rgba(255,255,255,0.4);
        cursor: pointer; padding: 0; font-size: 0.8rem; line-height: 1;
    }
    .compare-bar-chip button:hover { color: var(--rose); }
    .btn-go-compare {
        padding: 8px 22px;
        background: linear-gradient(135deg, var(--gold), var(--gold-light));
        color: #0e0b0c;
        border: none;
        border-radius: 40px;
        font-family: 'Jost', sans-serif;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 1px;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.2s;
        white-space: nowrap;
    }
    .btn-go-compare:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-clear-compare {
        padding: 7px 16px;
        background: transparent;
        border: 1px solid rgba(185,59,86,0.4);
        border-radius: 40px;
        color: var(--rose);
        font-family: 'Jost', sans-serif;
        font-size: 0.72rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-clear-compare:hover { background: var(--rose); color: #fff; }

    @media (max-width: 576px) {
        .premium-decorators-section { padding: 44px 14px 60px; }
        .section-title-premium { font-size: 2.2rem; }
        .decorator-title { font-size: 1.25rem; }
        .price-amount { font-size: 1.45rem; }
    }

    ::selection { background: var(--gold); color: #0e0b0c; }
</style>
</head>
<body>

<!-- NAVBAR -->
<div id="nav-container"></div>

<!-- Premium Decorators Showcase -->
<div class="premium-decorators-section">
    <div class="premium-section-accent"></div>
    <h2 class="section-title-premium">Master <span>Designers</span></h2>
    <p class="section-sub">Exquisite decor & event styling for royal celebrations</p>

    <div id="filterBar" class="filter-bar"></div>

    <div class="container">
        <div class="row g-3" id="productContainer"></div>
        <p id="noResults" class="no-results">Koi decorator nahi mila is area mein.</p>
    </div>
</div>

<!-- FOOTER -->
<div id="footer-container"></div>

<!-- FLOATING COMPARE BAR -->
<div id="wd-compare-bar">
    <div class="compare-bar-items" id="compareBarItems"></div>
    <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn-clear-compare" onclick="clearDecorCompare()">Clear</button>
        <button class="btn-go-compare" onclick="window.location.href='compare.html?cat=decorators'">
            <i class="fas fa-scale-balanced" style="margin-right:6px;"></i>Compare Now
        </button>
    </div>
</div>

<!-- TOAST -->
<div id="wd-compare-toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script>

// ===== NAVBAR & FOOTER =====
$(document).ready(() => {
    $.get('navebar.html', (data) => {
        $('#nav-container').html(data);
        var page = window.location.pathname.split('/').pop().replace('.html','').toLowerCase() || 'decorating';
        var pageMap = { 'decorating': 'vendors', 'decorating-detail': 'vendors' };
        var activeKey = pageMap[page] || 'vendors';
        $('.wd-menu-link').removeClass('active');
        $('.wd-mobile-list > li > a').removeClass('active');
        $('.wd-menu-link[data-nav="' + activeKey + '"]').addClass('active');
        $('.wd-mobile-list > li > a[data-nav="' + activeKey + '"]').addClass('active');
        updateDecorCompareBadge();
    });

    $.get('footer.html', (data) => { $('#footer-container').html(data); });
});

// ===== COMPARE SYSTEM =====
const WD_DECOR_KEY = 'wd_compare_decorators';
const WD_MAX_DECOR = 4;

function getDecorCompare() {
    try { return JSON.parse(localStorage.getItem(WD_DECOR_KEY) || '[]'); }
    catch { return []; }
}
function saveDecorCompare(arr) {
    localStorage.setItem(WD_DECOR_KEY, JSON.stringify(arr));
    updateDecorCompareBadge();
    renderDecorCompareBar();
}
function clearDecorCompare() {
    saveDecorCompare([]);
    document.querySelectorAll('.compare-card-btn').forEach(btn => {
        btn.classList.remove('added');
        const sp = btn.querySelector('span');
        if (sp) sp.textContent = 'Compare';
    });
    showDecorToast('Comparison cleared');
}

// Event delegation on container
document.getElementById('productContainer').addEventListener('click', function(e) {
    const btn = e.target.closest('.compare-card-btn');
    if (!btn) return;
    e.stopPropagation();

    let item;
    try { item = JSON.parse(btn.dataset.compareItem); }
    catch { return; }

    let list = getDecorCompare();
    const idx = list.findIndex(i => i.id == item.id);

    if (idx > -1) {
        list.splice(idx, 1);
        btn.classList.remove('added');
        const sp = btn.querySelector('span');
        if (sp) sp.textContent = 'Compare';
        showDecorToast('Removed from comparison');
    } else {
        if (list.length >= WD_MAX_DECOR) {
            showDecorToast('Max 4 items! Pehle koi hatao.', true);
            return;
        }
        list.push(item);
        btn.classList.add('added');
        const sp = btn.querySelector('span');
        if (sp) sp.textContent = 'Added ✓';
        showDecorToast('Added to comparison!');
    }
    saveDecorCompare(list);
});

function syncDecorCompareButtons() {
    const ids = getDecorCompare().map(i => String(i.id));
    document.querySelectorAll('.compare-card-btn').forEach(btn => {
        if (ids.includes(String(btn.dataset.compareId))) {
            btn.classList.add('added');
            const sp = btn.querySelector('span');
            if (sp) sp.textContent = 'Added ✓';
        }
    });
    renderDecorCompareBar();
}

function renderDecorCompareBar() {
    const list = getDecorCompare();
    const bar = document.getElementById('wd-compare-bar');
    const itemsEl = document.getElementById('compareBarItems');

    if (list.length === 0) {
        bar.classList.remove('visible');
        return;
    }

    bar.classList.add('visible');
    itemsEl.innerHTML = `<span style="font-family:'Jost';font-size:0.7rem;color:rgba(255,255,255,0.4);margin-right:4px;">${list.length}/4</span>` +
        list.map(item => `
            <div class="compare-bar-chip">
                <i class="fas fa-palette" style="font-size:0.65rem;"></i>
                ${item.name}
                <button onclick="removeDecorFromBar(${item.id})" title="Remove">×</button>
            </div>
        `).join('');
}

function removeDecorFromBar(id) {
    let list = getDecorCompare().filter(i => i.id != id);
    saveDecorCompare(list);
    const btn = document.querySelector(`.compare-card-btn[data-compare-id="${id}"]`);
    if (btn) {
        btn.classList.remove('added');
        const sp = btn.querySelector('span');
        if (sp) sp.textContent = 'Compare';
    }
    showDecorToast('Removed');
}

function updateDecorCompareBadge() {
    const cats = ['halls','caterers','photographers','decorators','carrentals'];
    let total = 0;
    cats.forEach(c => {
        try { total += JSON.parse(localStorage.getItem('wd_compare_' + c) || '[]').length; }
        catch {}
    });
    const badge = document.getElementById('compareNavBadge');
    if (!badge) return;
    badge.textContent = total;
    badge.classList.toggle('visible', total > 0);
}

function showDecorToast(msg, isError = false) {
    const t = document.getElementById('wd-compare-toast');
    t.textContent = msg;
    t.className = isError ? 'error-toast show' : 'show';
    clearTimeout(t._tid);
    t._tid = setTimeout(() => { t.className = t.className.replace(' show','').replace('show',''); }, 2400);
}

// ===== DECORATORS PAGE LOGIC =====
const productContainer = document.getElementById('productContainer');
const filterBar = document.getElementById('filterBar');
const noResults = document.getElementById('noResults');

function formatPKR(num) { return num.toLocaleString('en-PK'); }

function buildStars(rating) {
    const full = Math.floor(rating), half = (rating - full) >= 0.5 ? 1 : 0, empty = 5 - full - half;
    let s = '';
    for (let i = 0; i < full; i++) s += '<i class="fas fa-star"></i>';
    if (half) s += '<i class="fas fa-star-half-alt"></i>';
    for (let i = 0; i < empty; i++) s += '<i class="far fa-star"></i>';
    return s;
}

function buildCard(item) {
    const imgSrc = item.image ? `images/decorators/${item.image}` : '';

    const compareData = JSON.stringify({
        id: item.id,
        name: item.name,
        image: imgSrc,
        city: item.area,
        area: item.area,
        rating: item.rating,
        price: item.starting_price,
        priceType: item.price_type || 'package',
        events: (item.events_types || []).join(', '),
        verified: item.verified || false
    }).replace(/'/g, '&#39;');

    return `
    <div class="col-12 col-md-6 col-lg-4 col-xl-3 card-item" data-area="${item.area}">
        <div class="premium-card-wrapper">
            <div class="premium-card">
                <div class="card-img-container position-relative">
                    <img
                        src="${imgSrc}"
                        alt="${item.name}"
                        onerror="this.src='https://images.unsplash.com/photo-1519167758481-83f45f2ab202?w=400&q=50';"
                    >
                    <div class="img-overlay"></div>
                    ${item.verified ? `<div class="premium-badge"><i class="fas fa-crown"></i> PREMIUM</div>` : ''}
                    <button class="compare-card-btn"
                        data-compare-id="${item.id}"
                        data-compare-item='${compareData}'>
                        <i class="fas fa-scale-balanced"></i> <span>Compare</span>
                    </button>
                </div>
                <div class="card-body-custom">
                    <div>
                        <h2 class="decorator-title">${item.name}</h2>
                        <div class="location-text">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${item.area}</span>
                        </div>
                        <div class="rating-wrapper">
                            <div class="stars">${buildStars(item.rating)}</div>
                            <span class="rating-number">${item.rating}</span>
                        </div>
                    </div>
                    <div>
                        <div class="gold-divider"></div>
                        <div class="price-section">
                            <div>
                                <div class="d-flex-price">
                                    <span class="price-pkr">PKR</span>
                                    <span class="price-amount">${formatPKR(item.starting_price)}</span>
                                </div>
                                <small class="price-type">${item.price_type ? `(${item.price_type})` : '(starting package)'}</small>
                            </div>
                            <button class="btn-view-details view-details-btn" data-id="${item.id}" data-decorator="${item.name}">
                                <i class="fas fa-arrow-right"></i> Details
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>`;
}

function buildFilters(areas) {
    let btns = `<button class="filter-btn active" data-filter="all">All Areas</button>`;
    areas.forEach(area => {
        btns += `<button class="filter-btn" data-filter="${area}">${area}</button>`;
    });
    filterBar.innerHTML = btns;

    filterBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        const cards = document.querySelectorAll('.card-item');
        let visible = 0;
        cards.forEach(card => {
            const match = filter === 'all' || card.dataset.area === filter;
            card.style.display = match ? '' : 'none';
            if (match) visible++;
        });
        noResults.style.display = visible === 0 ? 'block' : 'none';
    });
}

async function getProducts() {
    try {
        const response = await axios.get('decorators.json');
        const data = response.data;

        const areas = [...new Set(data.map(i => i.area))];
        buildFilters(areas);
        productContainer.innerHTML = data.map(buildCard).join('');

        syncDecorCompareButtons();

        productContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.view-details-btn');
            if (!btn) return;
            const id = btn.dataset.id;
            window.location.href = `decorating-detail.html?id=${id}`;
        });

    } catch (error) {
        console.error('decorators.json load error:', error);
    }
}

getProducts();
</script>

</body>
</html>
