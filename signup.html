<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WeDream – Create Account</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --rose:#b93b56;
  --rose-hover:#a22f49;
  --gold:#c89b2c;
  --gold-light:#e8b93c;
  --white:#ffffff;
  --white-light:rgba(255,255,255,0.72);
  --white-dim:rgba(255,255,255,0.35);
  --glass:rgba(15,10,14,0.55);
  --dark:#070707;
  --dark2:#0f0a0e;
  --dark3:#1a1118;
  --border:rgba(200,155,44,0.3);
  --border-focus:rgba(200,155,44,0.8);
  --error:#e05c5c;
  --success:#4caf82;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--dark);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  position:relative;
  overflow-x:hidden;
}

/* Background pattern */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%, rgba(200,155,44,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 80%, rgba(185,59,86,0.07) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

/* Sparkle decorations */
.sparkle{
  position:fixed;
  color:var(--gold);
  opacity:0.2;
  font-size:20px;
  animation:twinkle 3s ease-in-out infinite;
  z-index:0;
  pointer-events:none;
}
.sparkle.s1{top:10%;left:8%;animation-delay:0s;}
.sparkle.s2{top:20%;right:10%;color:var(--rose);animation-delay:1s;}
.sparkle.s3{bottom:15%;left:12%;animation-delay:1.8s;}
.sparkle.s4{bottom:25%;right:8%;animation-delay:0.5s;font-size:14px;}
.sparkle.s5{top:50%;left:3%;animation-delay:2.2s;font-size:12px;}
@keyframes twinkle{
  0%,100%{opacity:0.1;transform:scale(1) rotate(0deg);}
  50%{opacity:0.35;transform:scale(1.3) rotate(20deg);}
}

/* Card */
.auth-card{
  background:var(--dark2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:44px 40px 36px;
  width:100%;
  max-width:480px;
  position:relative;
  z-index:1;
  animation:slideUp 0.5s ease both;
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}

/* Logo */
.brand{
  text-align:center;
  margin-bottom:28px;
}
.brand-logo{
  font-family:'Playfair Display',serif;
  font-size:26px;
  color:var(--gold);
  letter-spacing:1px;
}
.brand-logo span{color:var(--rose);}
.brand-tagline{
  font-size:12px;
  color:var(--white-dim);
  margin-top:4px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

/* Heading */
.auth-heading{
  font-family:'Playfair Display',serif;
  font-size:22px;
  color:var(--white);
  text-align:center;
  margin-bottom:6px;
}
.auth-sub{
  font-size:13px;
  color:var(--white-dim);
  text-align:center;
  margin-bottom:28px;
}

/* Form groups */
.form-row{display:flex;gap:14px;}
.form-row .fg{flex:1;min-width:0;}
.fg{margin-bottom:16px;position:relative;}
.fg label{
  display:block;
  font-size:12px;
  font-weight:500;
  color:var(--white-light);
  margin-bottom:6px;
  letter-spacing:0.5px;
  text-transform:uppercase;
}
.input-wrap{position:relative;}
.input-wrap i.icon-left{
  position:absolute;
  left:14px;top:50%;transform:translateY(-50%);
  color:var(--gold);
  font-size:16px;
  pointer-events:none;
}
.input-wrap i.icon-right{
  position:absolute;
  right:14px;top:50%;transform:translateY(-50%);
  color:var(--white-dim);
  font-size:16px;
  cursor:pointer;
  transition:color 0.2s;
  z-index:2;
}
.input-wrap i.icon-right:hover{color:var(--gold);}
.fg input{
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  padding:12px 14px 12px 42px;
  outline:none;
  transition:border-color 0.25s, background 0.25s, box-shadow 0.25s;
}
.fg input.has-right{padding-right:42px;}
.fg input::placeholder{color:var(--white-dim);}
.fg input:focus{
  border-color:var(--border-focus);
  background:rgba(200,155,44,0.05);
  box-shadow:0 0 0 3px rgba(200,155,44,0.1);
}
.fg input.error-field{
  border-color:var(--error);
  box-shadow:0 0 0 3px rgba(224,92,92,0.12);
}
.fg input.success-field{
  border-color:var(--success);
}

/* Error / success messages */
.field-msg{
  font-size:11.5px;
  margin-top:5px;
  padding-left:2px;
  display:none;
  align-items:center;
  gap:4px;
}
.field-msg.show{display:flex;}
.field-msg.err{color:var(--error);}
.field-msg.ok{color:var(--success);}

/* Password strength */
.strength-bar{
  display:none;
  margin-top:8px;
  gap:4px;
}
.strength-bar.show{display:flex;}
.strength-bar span{
  height:3px;
  flex:1;
  border-radius:2px;
  background:rgba(255,255,255,0.1);
  transition:background 0.3s;
}
.strength-label{
  font-size:11px;
  color:var(--white-dim);
  margin-top:4px;
  text-align:right;
  height:14px;
}

/* Terms */
.terms-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-bottom:20px;
}
.terms-row input[type=checkbox]{
  width:16px;height:16px;
  accent-color:var(--gold);
  margin-top:2px;
  cursor:pointer;
  flex-shrink:0;
}
.terms-row label{
  font-size:12.5px;
  color:var(--white-dim);
  line-height:1.5;
  cursor:pointer;
}
.terms-row label a{color:var(--gold);text-decoration:none;}
.terms-row label a:hover{text-decoration:underline;}

/* Submit button */
.btn-submit{
  width:100%;
  background:var(--rose);
  border:none;
  border-radius:10px;
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  font-weight:600;
  padding:14px;
  cursor:pointer;
  transition:background 0.2s, transform 0.15s, box-shadow 0.2s;
  letter-spacing:0.3px;
  position:relative;
  overflow:hidden;
}
.btn-submit::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.08) 0%,transparent 60%);
  pointer-events:none;
}
.btn-submit:hover:not(:disabled){background:var(--rose-hover);transform:translateY(-1px);box-shadow:0 6px 20px rgba(185,59,86,0.35);}
.btn-submit:active{transform:translateY(0);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;}
.btn-submit .spinner{
  display:none;
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* Footer link */
.auth-footer{
  text-align:center;
  margin-top:20px;
  font-size:13px;
  color:var(--white-dim);
}
.auth-footer a{color:var(--gold);text-decoration:none;font-weight:500;}
.auth-footer a:hover{text-decoration:underline;}

/* Toast */
.toast-wrap{
  position:fixed;
  top:24px;right:24px;
  z-index:9999;
  display:flex;flex-direction:column;gap:10px;
}
.toast{
  background:var(--dark3);
  border-left:3px solid var(--gold);
  border-radius:10px;
  padding:14px 18px;
  color:var(--white);
  font-size:13.5px;
  min-width:240px;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
  display:flex;align-items:center;gap:10px;
  animation:toastIn 0.35s ease both;
}
.toast.err-toast{border-left-color:var(--error);}
.toast.ok-toast{border-left-color:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* Divider */
.divider{
  display:flex;align-items:center;gap:12px;
  margin:18px 0;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
}
.divider span{font-size:12px;color:var(--white-dim);}

@media(max-width:480px){
  .auth-card{padding:32px 20px 28px;}
  .form-row{flex-direction:column;gap:0;}
}
</style>
</head>
<body>

<!-- Sparkles -->
<span class="sparkle s1">✦</span>
<span class="sparkle s2">✦</span>
<span class="sparkle s3">✦</span>
<span class="sparkle s4">✦</span>
<span class="sparkle s5">✦</span>

<!-- Toast container -->
<div class="toast-wrap" id="toastWrap"></div>

<div class="auth-card">
  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo">We<span>Dream</span></div>
    <div class="brand-tagline">Your Perfect Wedding Awaits</div>
  </div>

  <h2 class="auth-heading">Create Your Account</h2>
  <p class="auth-sub">Join thousands of couples planning their dream wedding</p>

  <form id="signupForm" novalidate>

    <!-- Name row -->
    <div class="form-row">
      <div class="fg" id="fg-fname">
        <label for="fname">First Name</label>
        <div class="input-wrap">
          <i class="bi bi-person icon-left"></i>
          <input type="text" id="fname" placeholder="Muhammad" autocomplete="given-name"/>
        </div>
        <div class="field-msg err" id="err-fname"><i class="bi bi-x-circle-fill"></i><span></span></div>
      </div>
      <div class="fg" id="fg-lname">
        <label for="lname">Last Name</label>
        <div class="input-wrap">
          <i class="bi bi-person icon-left"></i>
          <input type="text" id="lname" placeholder="Owais" autocomplete="family-name"/>
        </div>
        <div class="field-msg err" id="err-lname"><i class="bi bi-x-circle-fill"></i><span></span></div>
      </div>
    </div>

    <!-- Email -->
    <div class="fg" id="fg-email">
      <label for="email">Email Address</label>
      <div class="input-wrap">
        <i class="bi bi-envelope icon-left"></i>
        <input type="email" id="email" placeholder="its.owaisansari314@.com" autocomplete="email"/>
      </div>
      <div class="field-msg err" id="err-email"><i class="bi bi-x-circle-fill"></i><span></span></div>
    </div>

    <!-- Phone -->
    <div class="fg" id="fg-phone">
      <label for="phone">Phone Number</label>
      <div class="input-wrap">
        <i class="bi bi-telephone icon-left"></i>
        <input type="tel" id="phone" placeholder="03XX-XXXXXXX" autocomplete="tel"/>
      </div>
      <div class="field-msg err" id="err-phone"><i class="bi bi-x-circle-fill"></i><span></span></div>
    </div>

    <!-- Password -->
    <div class="fg" id="fg-password">
      <label for="password">Password</label>
      <div class="input-wrap">
        <i class="bi bi-lock icon-left"></i>
        <input type="password" id="password" placeholder="Create a strong password" class="has-right" autocomplete="new-password"/>
        <i class="bi bi-eye icon-right" id="togglePass" title="Show/hide password"></i>
      </div>
      <div class="strength-bar" id="strengthBar">
        <span id="sb1"></span><span id="sb2"></span><span id="sb3"></span><span id="sb4"></span>
      </div>
      <div class="strength-label" id="strengthLabel"></div>
      <div class="field-msg err" id="err-password"><i class="bi bi-x-circle-fill"></i><span></span></div>
    </div>

    <!-- Confirm Password -->
    <div class="fg" id="fg-cpassword">
      <label for="cpassword">Confirm Password</label>
      <div class="input-wrap">
        <i class="bi bi-lock-fill icon-left"></i>
        <input type="password" id="cpassword" placeholder="Repeat your password" class="has-right" autocomplete="new-password"/>
        <i class="bi bi-eye icon-right" id="toggleCpass" title="Show/hide password"></i>
      </div>
      <div class="field-msg err" id="err-cpassword"><i class="bi bi-x-circle-fill"></i><span></span></div>
      <div class="field-msg ok" id="ok-cpassword"><i class="bi bi-check-circle-fill"></i><span>Passwords match</span></div>
    </div>

    <!-- Terms -->
    <div class="terms-row">
      <input type="checkbox" id="terms"/>
      <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
    </div>
    <div class="field-msg err" id="err-terms" style="margin-top:-10px;margin-bottom:14px;"><i class="bi bi-x-circle-fill"></i><span>Please accept terms to continue</span></div>

    <button type="submit" class="btn-submit" id="submitBtn">
      <span id="btnText">Create Account</span>
      <div class="spinner" id="btnSpinner"></div>
    </button>

  </form>

  <div class="divider"><span>Already have an account?</span></div>
  <div class="auth-footer">
    <a href="login.html">Sign In to WeDream <i class="bi bi-arrow-right"></i></a>
  </div>
</div>

<script>
// ─── Helpers ───────────────────────────────────────────────
function showErr(id, msg){
  const el = document.getElementById('err-'+id);
  if(!el) return;
  el.querySelector('span').textContent = msg;
  el.classList.add('show');
  const inp = document.getElementById(id);
  if(inp){ inp.classList.add('error-field'); inp.classList.remove('success-field'); }
}
function clearErr(id){
  const el = document.getElementById('err-'+id);
  if(el) el.classList.remove('show');
  const inp = document.getElementById(id);
  if(inp){ inp.classList.remove('error-field'); }
}
function markOk(id){
  const inp = document.getElementById(id);
  if(inp){ inp.classList.remove('error-field'); inp.classList.add('success-field'); }
  clearErr(id);
}
function showToast(msg, type='ok'){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast '+(type==='err'?'err-toast':'ok-toast');
  t.innerHTML = `<i class="bi ${type==='err'?'bi-x-circle':'bi-check-circle'}" style="color:${type==='err'?'#e05c5c':'#4caf82'};font-size:18px"></i> ${msg}`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity 0.4s'; setTimeout(()=>t.remove(),400); }, 3500);
}

// ─── Password strength ─────────────────────────────────────
const passInput = document.getElementById('password');
const bar = document.getElementById('strengthBar');
const lbl = document.getElementById('strengthLabel');
const bars = [document.getElementById('sb1'),document.getElementById('sb2'),document.getElementById('sb3'),document.getElementById('sb4')];
const colors = ['#e05c5c','#e0943c','#c89b2c','#4caf82'];
const labels = ['Weak','Fair','Good','Strong'];

function calcStrength(p){
  let s=0;
  if(p.length>=8) s++;
  if(/[A-Z]/.test(p)) s++;
  if(/[0-9]/.test(p)) s++;
  if(/[^A-Za-z0-9]/.test(p)) s++;
  return s;
}

passInput.addEventListener('input',()=>{
  const v = passInput.value;
  if(v.length===0){ bar.classList.remove('show'); lbl.textContent=''; return; }
  bar.classList.add('show');
  const s = calcStrength(v);
  bars.forEach((b,i)=>{ b.style.background = i<s ? colors[s-1] : 'rgba(255,255,255,0.1)'; });
  lbl.style.color = colors[s-1];
  lbl.textContent = labels[s-1] || '';
});

// ─── Toggle password visibility ────────────────────────────
document.getElementById('togglePass').addEventListener('click',function(){
  const inp = document.getElementById('password');
  const show = inp.type==='password';
  inp.type = show?'text':'password';
  this.className = show ? 'bi bi-eye-slash icon-right' : 'bi bi-eye icon-right';
});
document.getElementById('toggleCpass').addEventListener('click',function(){
  const inp = document.getElementById('cpassword');
  const show = inp.type==='password';
  inp.type = show?'text':'password';
  this.className = show ? 'bi bi-eye-slash icon-right' : 'bi bi-eye icon-right';
});

// ─── Live confirm password check ───────────────────────────
document.getElementById('cpassword').addEventListener('input',function(){
  const p = document.getElementById('password').value;
  const c = this.value;
  if(c.length===0){ clearErr('cpassword'); document.getElementById('ok-cpassword').classList.remove('show'); return; }
  if(p===c){
    clearErr('cpassword');
    document.getElementById('ok-cpassword').classList.add('show');
    this.classList.add('success-field');
  } else {
    document.getElementById('ok-cpassword').classList.remove('show');
    showErr('cpassword','Passwords do not match');
  }
});

// ─── Regex validators ──────────────────────────────────────
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const PHONE_RE = /^(\+92|0)(3\d{9}|[0-9]{9,10})$/;
const NAME_RE  = /^[A-Za-z\s]{2,30}$/;

function validateForm(){
  let valid = true;
  const fname = document.getElementById('fname').value.trim();
  const lname = document.getElementById('lname').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim().replace(/[\s-]/g,'');
  const pass  = document.getElementById('password').value;
  const cpass = document.getElementById('cpassword').value;
  const terms = document.getElementById('terms').checked;

  // First name
  if(!fname){ showErr('fname','First name is required'); valid=false; }
  else if(!NAME_RE.test(fname)){ showErr('fname','Only letters allowed (2–30 chars)'); valid=false; }
  else markOk('fname');

  // Last name
  if(!lname){ showErr('lname','Last name is required'); valid=false; }
  else if(!NAME_RE.test(lname)){ showErr('lname','Only letters allowed (2–30 chars)'); valid=false; }
  else markOk('lname');

  // Email
  if(!email){ showErr('email','Email address is required'); valid=false; }
  else if(!EMAIL_RE.test(email)){ showErr('email','Enter a valid email address'); valid=false; }
  else markOk('email');

  // Phone
  if(!phone){ showErr('phone','Phone number is required'); valid=false; }
  else if(!PHONE_RE.test(phone)){ showErr('phone','Enter valid Pakistani number (e.g. 03XX-XXXXXXX)'); valid=false; }
  else markOk('phone');

  // Password
  if(!pass){ showErr('password','Password is required'); valid=false; }
  else if(pass.length<8){ showErr('password','Password must be at least 8 characters'); valid=false; }
  else if(calcStrength(pass)<2){ showErr('password','Too weak — add uppercase, numbers or symbols'); valid=false; }
  else markOk('password');

  // Confirm password
  if(!cpass){ showErr('cpassword','Please confirm your password'); valid=false; }
  else if(pass!==cpass){ showErr('cpassword','Passwords do not match'); valid=false; }
  else markOk('cpassword');

  // Terms
  if(!terms){
    document.getElementById('err-terms').classList.add('show');
    valid=false;
  } else {
    document.getElementById('err-terms').classList.remove('show');
  }

  return valid;
}

// ─── Form submit ───────────────────────────────────────────
document.getElementById('signupForm').addEventListener('submit', function(e){
  e.preventDefault();
  if(!validateForm()) return;

  // Check if email already exists
  const email = document.getElementById('email').value.trim().toLowerCase();
  const existing = JSON.parse(localStorage.getItem('wd_users')||'[]');
  if(existing.find(u=>u.email===email)){
    showErr('email','This email is already registered');
    showToast('Email already registered. Please login.','err');
    return;
  }

  // Show loading
  const btn = document.getElementById('submitBtn');
  document.getElementById('btnText').style.display='none';
  document.getElementById('btnSpinner').style.display='block';
  btn.disabled=true;

  setTimeout(()=>{
    const user = {
      fname: document.getElementById('fname').value.trim(),
      lname: document.getElementById('lname').value.trim(),
      email: email,
      phone: document.getElementById('phone').value.trim(),
      password: btoa(document.getElementById('password').value), // base64 encode
      createdAt: new Date().toISOString()
    };
    existing.push(user);
    localStorage.setItem('wd_users', JSON.stringify(existing));

    showToast('Account created successfully! Redirecting...','ok');
    setTimeout(()=>{ window.location.href='login.html'; },1800);
  },1200);
});

// ─── Clear errors on input ────────────────────────────────
['fname','lname','email','phone','password'].forEach(id=>{
  const el = document.getElementById(id);
  if(el) el.addEventListener('input',()=>clearErr(id));
});
</script>
</body>
</html>
