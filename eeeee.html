<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LuxeHaven | Premium Banquet Halls</title>
    <!-- Bootstrap 5 CSS + Icons + Google Fonts + Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0708;
            font-family: 'Jost', sans-serif;
            overflow-x: hidden;
        }

        /* root colors premium palette (rose + gold + deep dark) */
        :root {
            --rose: #b93b56;
            --rose-hover: #a22f49;
            --gold: #c89b2c;
            --gold-light: #e8b93c;
            --white: #ffffff;
            --dark-bg: #0e0b0c;
            --card-glass: rgba(18, 14, 16, 0.75);
            --border-glow: rgba(200, 155, 44, 0.35);
        }

        /* premium cards wrapper section */
        .premium-halls-section {
            padding: 80px 24px 100px;
            background: radial-gradient(circle at 10% 20%, #110c0e 0%, #050303 100%);
            position: relative;
        }

        /* subtle gold accent line above section */
        .premium-section-accent {
            height: 2px;
            width: 120px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), transparent);
            margin: 0 auto 20px auto;
        }

        .section-title-premium {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 12px;
        }
        .section-title-premium span {
            color: var(--gold);
            font-style: italic;
        }
        .section-sub {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 48px;
        }

        /* ========== PREMIUM CARD DESIGN (ELEVATED, GLASS, LUXURY) ========== */
        .premium-card-wrapper {
            margin-bottom: 32px;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.4s;
            height: 100%;
        }
        .premium-card-wrapper:hover {
            transform: translateY(-8px);
        }
        .premium-card {
            background: rgba(20, 16, 18, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(200, 155, 44, 0.3);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.7), 0 0 0 0.5px rgba(200, 155, 44, 0.15) inset;
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .premium-card:hover {
            border-color: rgba(200, 155, 44, 0.7);
            box-shadow: 0 30px 50px -18px black, 0 0 0 2px rgba(200, 155, 44, 0.2) inset;
            background: rgba(24, 19, 21, 0.9);
        }

        /* Image container premium */
        .card-img-container {
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(200, 155, 44, 0.4);
        }
        .card-img-container img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.7s ease;
            display: block;
        }
        .premium-card:hover .card-img-container img {
            transform: scale(1.04);
        }
        .img-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.1) 60%);
            pointer-events: none;
        }

        /* PREMIUM BADGE (top-left, elegant) */
        .premium-badge {
            position: absolute;
            top: 16px;
            left: 18px;
            background: linear-gradient(125deg, #c89b2c 0%, #d9aa3a 100%);
            color: #0e0b0c;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            padding: 6px 14px;
            border-radius: 30px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,215,120,0.5);
            backdrop-filter: blur(2px);
            font-family: 'Jost', sans-serif;
            z-index: 3;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .premium-badge i {
            font-size: 0.7rem;
            color: #231f1a;
        }

        /* card body custom */
        .card-body-custom {
            padding: 1.5rem 1.4rem 1.8rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .hall-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.65rem;
            font-weight: 700;
            color: #f5efdf;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .location-text {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.8rem;
            margin-bottom: 14px;
            font-weight: 400;
        }
        .location-text i {
            color: var(--gold);
            font-size: 0.75rem;
        }

        /* rating stars & review premium */
        .rating-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .stars {
            color: var(--gold);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        .stars i {
            margin-right: 2px;
        }
        .rating-number {
            font-weight: 700;
            color: #fff;
            font-size: 0.9rem;
            background: rgba(200,155,44,0.18);
            padding: 2px 8px;
            border-radius: 40px;
        }
        .review-count {
            color: rgba(255,255,255,0.5);
            font-size: 0.7rem;
            font-weight: 400;
        }

        /* gold divider elegance */
        .gold-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), transparent);
            margin: 12px 0 16px 0;
            width: 100%;
        }

        /* price section + button */
        .price-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: auto;
        }
        .d-flex-price {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px;
        }
        .price-pkr {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--gold-light);
            letter-spacing: 1px;
        }
        .price-amount {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            font-weight: 800;
            color: #f5e2b0;
            line-height: 1;
            letter-spacing: 1px;
        }
        .text-muted {
            color: rgba(255,255,255,0.45) !important;
            font-size: 0.7rem;
        }

        /* VIEW DETAILS BUTTON - premium style */
        .btn-view-details {
            background: transparent;
            border: 1.2px solid rgba(200, 155, 44, 0.65);
            padding: 8px 20px;
            border-radius: 40px;
            color: var(--gold-light);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            cursor: pointer;
        }
        .btn-view-details i {
            font-size: 0.7rem;
            transition: transform 0.2s;
        }
        .btn-view-details:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: #0e0b0c;
            box-shadow: 0 5px 14px rgba(200, 155, 44, 0.3);
            transform: translateY(-2px);
        }
        .btn-view-details:hover i {
            transform: translateX(4px);
            color: #0e0b0c;
        }

        /* responsive grid adjustments using bootstrap row+col */
        @media (max-width: 767.98px) {
            .premium-halls-section {
                padding: 50px 16px 70px;
            }
            .hall-title {
                font-size: 1.4rem;
            }
            .price-amount {
                font-size: 1.6rem;
            }
            .card-body-custom {
                padding: 1.2rem;
            }
            .card-img-container img {
                height: 190px;
            }
        }

        @media (min-width: 768px) and (max-width: 991.98px) {
            .card-img-container img {
                height: 210px;
            }
            .price-amount {
                font-size: 1.7rem;
            }
        }

        @media (min-width: 1200px) {
            .card-img-container img {
                height: 240px;
            }
        }

        /* subtle floating animation on cards */
        @keyframes cardGlow {
            0% { box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
            100% { box-shadow: 0 20px 35px -8px rgba(200,155,44,0.2); }
        }

        /* extra micro interactions */
        .premium-card {
            transition: all 0.4s;
        }
    </style>
</head>
<body>


                <!-- CARD 2 - Pearl Continental Royale (luxury) -->
                <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                    <div class="premium-card-wrapper">
                        <div class="premium-card">
                            <div class="card-img-container position-relative">
                                <img src="https://placehold.co/800x500/1e2a32/d4b87a?text=Pearl+Continental+Grand" alt="Pearl Continental Royale">
                                <div class="img-overlay"></div>
                                <div class="premium-badge">
                                    <i class="fas fa-crown me-1"></i> PREMIUM
                                </div>
                            </div>
                            <div class="card-body-custom">
                                <h2 class="hall-title">PC Royale Ballroom</h2>
                                <div class="location-text">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <span>Club Road, Karachi</span>
                                </div>
                                <div class="rating-wrapper">
                                    <div class="stars">
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                        <i class="fas fa-star"></i>
                                    </div>
                                    <span class="rating-number">4.9</span>
                                    <span class="review-count">(187 reviews)</span>
                                </div>
                                <div class="gold-divider"></div>
                                <div class="price-section">
                                    <div class="d-flex-price">
                                        <span class="price-pkr">PKR</span>
                                        <span class="price-amount">18,50,000</span>
                                        <small class="text-muted ms-1">/ event</small>
                                    </div>
                                    <button class="btn-view-details view-details-btn" data-hall="PC Royale Ballroom">
                                        <i class="fas fa-arrow-right"></i> View Details
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

          

    <!-- Optional popup / toast for "View Details" demonstration (premium interactive) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
        <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="3000" style="background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); border-left: 5px solid var(--gold);">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="fas fa-gem me-2" style="color: var(--gold);"></i> 
                    <strong id="toastHallName">Hall</strong> – premium details & availability will be shown soon.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS + Popper (for toast and potential future interactions) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // View Details interactive premium toast (luxury feedback)
        document.addEventListener('DOMContentLoaded', function() {
            const viewButtons = document.querySelectorAll('.view-details-btn');
            const toastEl = document.getElementById('liveToast');
            let bsToast;
            if (toastEl) {
                bsToast = new bootstrap.Toast(toastEl, { autohide: true, delay: 2800 });
            }
            viewButtons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const hallName = this.getAttribute('data-hall') || 'Selected Venue';
                    const toastBodyStrong = document.getElementById('toastHallName');
                    if (toastBodyStrong) toastBodyStrong.innerText = hallName;
                    if (bsToast) bsToast.show();
                    else {
                        // fallback alert just in case
                        alert(`✨ ${hallName} — premium experience awaits. Full details & exclusive offers contact our concierge.`);
                    }
                    // tiny micro interaction: ripple / vibe
                    this.style.transform = 'scale(0.98)';
                    setTimeout(() => { if(this) this.style.transform = ''; }, 150);
                });
            });
        });
    </script>
    <!-- Additional style for consistent spacing & responsive perfection -->
    <style>
        /* ensure equal height cards on all screen sizes */
        .premium-card {
            transition: all 0.25s;
        }
        .premium-card-wrapper {
            height: 100%;
        }
        .card-body-custom {
            flex: 1;
            justify-content: space-between;
        }
        .price-section {
            margin-top: auto;
        }
        .btn-view-details:active {
            transform: scale(0.96);
        }
        ::selection {
            background: var(--gold);
            color: #0e0b0c;
        }
        .gold-divider {
            opacity: 0.7;
        }
        /* custom responsive images consistency */
        @media (max-width: 576px) {
            .price-amount {
                font-size: 1.5rem;
            }
            .btn-view-details {
                padding: 6px 16px;
                font-size: 0.65rem;
            }
            .premium-badge {
                font-size: 0.6rem;
                padding: 4px 10px;
                top: 12px;
                left: 12px;
            }
            .hall-title {
                font-size: 1.3rem;
            }
        }
    </style>
</body>
</html>
