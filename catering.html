<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Caterers | WeDream</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ----- RESET & ROOT (same as halls) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --rose: #b93b56;
      --rose-hover: #a22f49;
      --gold: #c89b2c;
      --gold-light: #e8b93c;
      --gold-dark: #8a691a;
      --dark: #0a0708;
      --dark2: #0e0b0c;
    }

    body {
      background: var(--dark);
      font-family: "Jost", sans-serif;
      color: #f0ede8;
      overflow-x: hidden;
    }

    /* ----- SECTION (same as halls) ----- */
    .premium-caterers-section {
      padding: 20px 24px 90px;
      background: radial-gradient(circle at 10% 20%, #110c0e 0%, #050303 100%);
      position: relative;
      min-height: 100vh;
    }

    .premium-section-accent {
      height: 2px;
      width: 120px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), transparent);
      margin: 0 auto 16px;
    }

    .section-title-premium {
      text-align: center;
      font-family: "Cormorant Garamond", serif;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 10px;
    }

    .section-title-premium span {
      color: var(--gold);
      font-style: italic;
    }

    .section-sub {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    /* ----- AREA RAIL (chips) ----- */
    .area-rail-wrap {
      max-width: 1200px;
      margin: 0 auto 18px;
    }
    .area-rail {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 4px 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--gold) transparent;
    }
    .area-rail::-webkit-scrollbar {
      height: 4px;
    }
    .area-rail::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 4px;
    }
    .area-chip {
      flex: 0 0 auto;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.55);
      font-family: "Jost", sans-serif;
      font-weight: 500;
      font-size: 0.78rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      padding: 10px 18px;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: color 0.25s;
    }
    .area-chip:hover {
      color: #fff;
    }
    .area-chip.active {
      color: var(--gold);
    }
    .area-chip.active::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 2px;
    }

    /* ----- TOOL ROW (search + sort + category) ----- */
    .tool-row {
      max-width: 1200px;
      margin: 0 auto 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }
    .tool-left {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      flex: 1;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 380px;
    }
    .search-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      font-size: 0.85rem;
    }
    .search-wrap input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(200, 155, 44, 0.2);
      color: #fff;
      padding: 11px 14px 11px 38px;
      border-radius: 12px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.25s;
    }
    .search-wrap input:focus {
      border-color: var(--gold);
    }
    .sort-wrap select {
      background: rgba(20, 15, 17, 0.95);
      border: 1px solid rgba(200, 155, 44, 0.2);
      color: #fff;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .sort-wrap select option {
      background: #15101a;
      color: #fff;
      padding: 10px;
    }

    /* ----- CATEGORY DROPDOWN (inline) ----- */
    .cat-trig-wrap {
      position: relative;
    }
    .cat-trig {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(200, 155, 44, 0.15), rgba(185, 59, 86, 0.12));
      border: 1px solid rgba(200, 155, 44, 0.45);
      color: var(--gold-light);
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      cursor: pointer;
      font-family: "Jost", sans-serif;
      transition: all 0.3s;
    }
    .cat-trig:hover {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #0b0708;
      border-color: transparent;
      box-shadow: 0 8px 22px rgba(200, 155, 44, 0.35);
    }
    .cat-trig i.fa-chevron-down {
      transition: transform 0.3s;
      font-size: 0.65rem;
    }
    .cat-trig.open i.fa-chevron-down {
      transform: rotate(180deg);
    }
    .cat-dd {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      background: rgba(14, 11, 12, 0.98);
      border: 1px solid var(--gold);
      border-radius: 14px;
      padding: 10px;
      min-width: 240px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: all 0.3s;
      z-index: 85;
    }
    .cat-dd.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .cat-dd-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 10px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.25s;
    }
    .cat-dd-item i {
      width: 18px;
      text-align: center;
      color: var(--gold);
      font-size: 0.9rem;
    }
    .cat-dd-item:hover {
      background: rgba(200, 155, 44, 0.12);
      color: #fff;
      padding-left: 16px;
    }
    .cat-dd-item.active {
      background: linear-gradient(135deg, rgba(200, 155, 44, 0.2), rgba(185, 59, 86, 0.08));
      color: var(--gold-light);
    }

    /* ----- CARDS (same as halls) ----- */
    .halls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 28px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .hall-card {
      position: relative;
      background: linear-gradient(160deg, #15101200 0%, #15101290 100%), #100b0d;
      border: 1px solid rgba(200, 155, 44, 0.12);
      border-radius: 22px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 0.5s,
        border-color 0.35s;
      box-shadow: 0 12px 30px -18px rgba(0, 0, 0, 0.9);
    }

    .hall-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 22px;
      padding: 1px;
      background: linear-gradient(135deg,
          rgba(200, 155, 44, 0.6),
          transparent 40%,
          transparent 60%,
          rgba(185, 59, 86, 0.4));
      -webkit-mask: linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
      z-index: 2;
    }

    .hall-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 30px 60px -22px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(200, 155, 44, 0.25);
    }

    .hall-card:hover::before {
      opacity: 1;
    }

    .hall-media {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
    }

    .hall-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.9s ease;
    }

    .hall-card:hover .hall-media img {
      transform: scale(1.1);
    }

    .hall-media::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top,
          rgba(7, 5, 6, 0.95) 0%,
          rgba(7, 5, 6, 0.2) 45%,
          transparent 70%);
      pointer-events: none;
    }

    .premium-icon {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px 5px 8px;
      border-radius: 20px;
      background: linear-gradient(135deg,
          rgba(11, 7, 8, 0.85),
          rgba(11, 7, 8, 0.65));
      border: 1px solid rgba(200, 155, 44, 0.55);
      backdrop-filter: blur(8px);
      color: var(--gold-light);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .premium-icon i {
      font-size: 0.7rem;
      color: var(--gold-light);
      text-shadow: 0 0 8px rgba(200, 155, 44, 0.6);
    }

    .compare-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      background: rgba(11, 7, 8, 0.85);
      border: 1px solid var(--gold);
      color: var(--gold);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(-6px) scale(0.85);
      transition: all 0.35s;
    }

    .hall-card:hover .compare-btn {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .compare-btn:hover {
      background: var(--gold);
      color: #0b0708;
      transform: scale(1.1);
    }

    .compare-btn.added {
      background: var(--gold);
      color: #0b0708;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .float-rating {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(11, 7, 8, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 208, 90, 0.35);
      padding: 5px 10px;
      border-radius: 20px;
      color: #ffd05a;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .hall-body {
      padding: 20px 20px 22px;
      position: relative;
      z-index: 1;
    }

    .hall-area {
      font-size: 0.65rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.9;
    }

    .hall-name {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.5rem;
      color: #fff;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .hall-meta-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }

    .price-block {
      display: flex;
      flex-direction: column;
    }

    .price-label {
      font-size: 0.6rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 2px;
    }

    .price-val {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem;
      color: var(--gold-light);
      font-weight: 700;
      line-height: 1;
    }

    .price-val small {
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.65rem;
      font-weight: 400;
      font-family: "Jost";
    }

    .details-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1a1214, #100b0d);
      color: var(--gold-light);
      border: 1px solid rgba(200, 155, 44, 0.35);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.35s;
      position: relative;
      overflow: hidden;
    }

    .details-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      transform: translateY(101%);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 0;
    }

    .details-btn span,
    .details-btn i {
      position: relative;
      z-index: 1;
      transition: color 0.3s;
    }

    .details-btn:hover {
      border-color: transparent;
      color: #0b0708;
    }

    .details-btn:hover::before {
      transform: translateY(0);
    }

    .details-btn:hover i {
      transform: translateX(4px);
    }

    /* ----- Compare tray (same as halls) ----- */
    .compare-tray {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: rgba(11, 7, 8, 0.95);
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 50;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .compare-tray.show {
      transform: translateX(-50%) translateY(0);
    }

    .compare-tray .ctitle {
      font-size: 0.78rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .compare-tray .cbtn {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #0b0708;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .compare-tray .cclear {
      background: transparent;
      color: rgba(255, 255, 255, 0.6);
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* ----- empty & loader ----- */
    .empty-state {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      padding: 60px 0;
      grid-column: 1/-1;
    }

    .loader-ring {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(200, 155, 44, 0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 60px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      .section-title-premium {
        font-size: 2.1rem;
      }
    }

    /* ===== CATEGORY DROPDOWN - MOBILE FIX ===== */
@media (max-width: 768px) {
  .cat-trig-wrap {
    width: 100%;
  }
  
  .cat-trig {
    padding-left: 20px !important;
    padding: 10px 14px !important;
    font-size: 0.7rem !important;
    letter-spacing: 1px !important;
    gap: 8px !important;
    width: 100% !important;
    justify-content: center !important;
  }
  
  .cat-dd {
    right: 0 !important;
    left: 0 !important;
    min-width: 0 !important;
    width: 100% !important;
  }
}

@media (max-width: 480px) {
  .cat-trig {
    padding-left: 16px !important;
    padding: 8px 12px !important;
    font-size: 0.6rem !important;
    letter-spacing: 0.5px !important;
    gap: 5px !important;
  }
  
  .cat-trig i.fa-layer-group {
    font-size: 0.7rem !important;
  }
  
  .cat-trig i.fa-chevron-down {
    font-size: 0.5rem !important;
  }
  
  .cat-dd {
    padding: 6px !important;
    border-radius: 10px !important;
    top: calc(100% + 6px) !important;
  }
  
  .cat-dd-item {
    padding: 8px 10px !important;
    font-size: 0.7rem !important;
    gap: 8px !important;
    border-radius: 8px !important;
  }
  
  .cat-dd-item i {
    font-size: 0.75rem !important;
    width: 16px !important;
  }
}
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div id="nav-container"></div>

  <!-- CATERERS SECTION (upgraded with search, sort, category) -->
  <section class="premium-caterers-section">
    <div class="premium-section-accent"></div>
    <h1 class="section-title-premium">Master <span>Chefs</span></h1>
    <p class="section-sub">Award-winning catering services for unforgettable feasts</p>

    <!-- AREA RAIL (chips) -->
    <div class="area-rail-wrap">
      <div class="area-rail" id="areaRail"></div>
    </div>

    <!-- TOOL ROW: search + sort + category dropdown -->
    <div class="tool-row">
      <div class="tool-left">
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" type="text" placeholder="Search by name…" />
        </div>
        <div class="sort-wrap">
          <select id="sortSel">
            <option value="rating">Top Rated</option>
            <option value="price_low">Price: Low to High</option>
            <option value="price_high">Price: High to Low</option>
            <option value="name">Name (A–Z)</option>
          </select>
        </div>
      </div>
      <div class="cat-trig-wrap">
        <button class="cat-trig" id="catTrig">
          <i class="fa-solid fa-layer-group"></i> Categories
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="cat-dd" id="catDd">
          <a href="halls.html" class="cat-dd-item"><i class="fa-solid fa-building-columns"></i> Halls</a>
          <a href="catering.html" class="cat-dd-item active"><i class="fa-solid fa-utensils"></i> Catering</a>
          <a href="photographers.html" class="cat-dd-item"><i class="fa-solid fa-camera-retro"></i> Photographers</a>
          <a href="carrentals.html" class="cat-dd-item"><i class="fa-solid fa-car"></i> Car Rentals</a>
          <a href="decorating.html" class="cat-dd-item"><i class="fa-solid fa-wand-magic-sparkles"></i> Decorators</a>
        </div>
      </div>
    </div>

    <!-- GRID -->
    <div class="halls-grid" id="hallsGrid">
      <div class="loader-ring"></div>
    </div>
  </section>

  <!-- Compare tray -->
  <div class="compare-tray" id="cmpTray">
    <span class="ctitle">Compare <b id="cmpCount">0</b>/3</span>
    <a class="cbtn" href="compare.html">Compare Now</a>
    <button class="cclear" id="cmpClear">Clear</button>
  </div>

  <!-- FOOTER -->
  <div id="footer-container"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ===== NAVBAR / FOOTER INJECTION =====
    $(document).ready(function() {
      $.get("navebar.html", function(d) {
        $("#nav-container").html(d);
        var page =
          window.location.pathname
          .split("/")
          .pop()
          .replace(".html", "")
          .toLowerCase() || "catering";
        var map = {
          catering: "vendors",
          "catering-detail": "vendors"
        };
        var key = map[page] || "vendors";
        $(".wd-menu-link").removeClass("active");
        $(".wd-mobile-list > li > a").removeClass("active");
        $('.wd-menu-link[data-nav="' + key + '"]').addClass("active");
        $('.wd-mobile-list > li > a[data-nav="' + key + '"]').addClass("active");
        updateCompareBadge();
      });
      $.get("footer.html", function(d) {
        $("#footer-container").html(d);
      });
    });

    // ===== COMPARE SYSTEM =====
    // Use same storage key as compare page expects: "cmp_caterers"
    let compareIds = JSON.parse(localStorage.getItem("cmp_caterers") || "[]");
    const grid = document.getElementById("hallsGrid");
    const fallback =
      "https://images.pexels.com/photos/265947/pexels-photo-265947.jpeg?auto=compress&cs=tinysrgb&w=800&h=520&fit=crop";

    let CATERERS = [];
    let currentArea = "All";

    // load caterers.json
    fetch("caterers.json")
      .then((r) => r.json())
      .then((data) => {
        CATERERS = data;
        buildAreas();
        render();
        updateTray();
      })
      .catch((e) => {
        grid.innerHTML = '<div class="empty-state">Failed to load caterers.</div>';
        console.error(e);
      });

    function buildAreas() {
      const areas = ["All", ...new Set(CATERERS.map((c) => c.area))];
      const rail = document.getElementById("areaRail");
      rail.innerHTML = areas
        .map(
          (a) =>
          `<button class="area-chip ${a === currentArea ? "active" : ""}" data-area="${a}">${a}</button>`
        )
        .join("");
      rail.querySelectorAll(".area-chip").forEach(
        (b) =>
        (b.onclick = () => {
          currentArea = b.dataset.area;
          buildAreas();
          render();
        })
      );
    }

    function render() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const sort = document.getElementById("sortSel").value;

      let list = CATERERS.filter(
        (c) =>
        (currentArea === "All" || c.area === currentArea) &&
        c.name.toLowerCase().includes(q)
      );

      // sorting
      list.sort((a, b) => {
        if (sort === "price_low") return a.starting_price - b.starting_price;
        if (sort === "price_high") return b.starting_price - a.starting_price;
        if (sort === "name") return a.name.localeCompare(b.name);
        return b.rating - a.rating; // rating
      });

      if (!list.length) {
        grid.innerHTML =
          '<div class="empty-state">No caterers match your filters.</div>';
        return;
      }

      grid.innerHTML = list
        .map(
          (c) => `
    <div class="hall-card" data-id="${c.id}">
      <div class="hall-media">
        <img src="${c.image || fallback}" alt="${c.name}" onerror="this.src='${fallback}'">
        <div class="premium-icon"><i class="fa-solid fa-crown"></i> Premium</div>
        <button class="compare-btn ${compareIds.includes(c.id) ? "added" : ""}" data-cmp="${c.id}" title="Add to compare"><i class="fa-solid fa-${compareIds.includes(c.id) ? "check" : "scale-balanced"}"></i></button>
        <div class="float-rating"><i class="fa-solid fa-star"></i>${c.rating}</div>
      </div>
      <div class="hall-body">
        <div class="hall-area"><i class="fa-solid fa-location-dot"></i>${c.area}</div>
        <div class="hall-name">${c.name}</div>
        <div class="hall-meta-row">
          <div class="price-block">
            <span class="price-label">Starting from</span>
            <span class="price-val">PKR ${c.starting_price.toLocaleString()} <small>onwards</small></span>
          </div>
        </div>
        <button class="details-btn" data-details="${c.id}"><span>View Details</span> <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>`
        )
        .join("");

      // card click -> detail
      grid.querySelectorAll(".hall-card").forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target.closest(".compare-btn")) return;
          window.location.href = "catering-detail.html?id=" + card.dataset.id;
        });
      });

      // compare button
      grid.querySelectorAll(".compare-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.cmp);
          toggleCompare(id);
        });
      });
    }

    function toggleCompare(id) {
      const i = compareIds.indexOf(id);
      if (i > -1) {
        compareIds.splice(i, 1);
      } else {
        if (compareIds.length >= 3) {
          alert("Max 3 caterers compare kar sakte hain");
          return;
        }
        compareIds.push(id);
      }
      localStorage.setItem("cmp_caterers", JSON.stringify(compareIds));
      render();
      updateTray();
      updateCompareBadge();
    }

    function updateTray() {
      document.getElementById("cmpCount").textContent = compareIds.length;
      document
        .getElementById("cmpTray")
        .classList.toggle("show", compareIds.length > 0);
    }

    document.getElementById("cmpClear").onclick = () => {
      compareIds = [];
      localStorage.setItem("cmp_caterers", "[]");
      render();
      updateTray();
      updateCompareBadge();
    };

    // search + sort live
    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("sortSel").addEventListener("change", render);

    // navbar badge (total from all compare keys)
    function updateCompareBadge() {
      const keys = ['cmp_halls', 'cmp_caterers', 'cmp_photographers', 'cmp_decorators', 'cmp_car-rentals'];
      let total = 0;
      keys.forEach(k => {
        try {
          const arr = JSON.parse(localStorage.getItem(k) || '[]');
          total += arr.length;
        } catch {}
      });
      const badge = document.getElementById('compareNavBadge');
      if (!badge) return;
      badge.textContent = total;
      badge.classList.toggle('visible', total > 0);
    }

    // ===== CATEGORY DROPDOWN (same as halls) =====
    const ctrig = document.getElementById("catTrig"),
      cdd = document.getElementById("catDd");
    ctrig.addEventListener("click", (e) => {
      e.stopPropagation();
      ctrig.classList.toggle("open");
      cdd.classList.toggle("open");
    });
    document.addEventListener("click", (e) => {
      if (!cdd.contains(e.target) && !ctrig.contains(e.target)) {
        cdd.classList.remove("open");
        ctrig.classList.remove("open");
      }
    });
  </script>

</body>
</html>
