<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Applications – Wed Dream</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    :root {
      --rose: #b93b56; --gold: #c89b2c; --gold-light:#e8b93c;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Jost',sans-serif;background:#000;color:#fff;overflow-x:hidden;}

    .ma-header{position:relative;padding:140px 0 70px;text-align:center;overflow:hidden;background:#000;}
    .ma-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 0%, rgba(200,155,44,0.10) 0%, transparent 70%);}
    .ma-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(200,155,44,0.5) 30%,rgba(185,59,86,0.5) 50%,rgba(200,155,44,0.5) 70%,transparent);}
    .ma-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(200,155,44,0.45);border-radius:50px;padding:8px 22px;font-size:9.5px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);background:rgba(200,155,44,0.07);backdrop-filter:blur(10px);margin-bottom:20px;}
    .ma-badge i{color:var(--rose);font-size:11px;}
    .ma-header h1{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,6vw,64px);font-weight:700;letter-spacing:3px;text-transform:uppercase;line-height:.95;}
    .ma-header h1 span{display:block;font-style:italic;color:var(--gold);font-size:clamp(28px,4.5vw,46px);letter-spacing:5px;margin-top:4px;}
    .ma-sub{margin-top:16px;color:rgba(255,255,255,0.55);font-size:13px;letter-spacing:1px;max-width:520px;margin-inline:auto;}

    .lookup-section{padding:0 0 90px;}
    .lookup-card{
      background:rgba(255,255,255,0.03);border:1px solid rgba(200,155,44,0.18);border-radius:16px;
      padding:36px;backdrop-filter:blur(20px); box-shadow:0 0 60px rgba(200,155,44,0.04),0 30px 80px rgba(0,0,0,0.5);
      margin-bottom:34px;
    }
    .lookup-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
    .lookup-row{display:flex;gap:12px;flex-wrap:wrap;}
    .lookup-row .form-control{flex:1;min-width:220px;background:rgba(255,255,255,0.04)!important;border:1px solid rgba(200,155,44,0.22)!important;border-radius:8px!important;color:#fff!important;font-size:13.5px;padding:12px 16px;}
    .lookup-row .form-control::placeholder{color:rgba(255,255,255,0.25)!important;}
    .lookup-row .form-control:focus{border-color:rgba(200,155,44,0.6)!important;box-shadow:0 0 0 3px rgba(200,155,44,0.08)!important;outline:none;}
    .btn-lookup{
      background:linear-gradient(135deg,var(--rose) 0%,#8a1f34 100%);color:#fff;border:none;border-radius:8px;
      padding:12px 30px;font-size:12.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
      font-family:'Jost',sans-serif;cursor:pointer;transition:transform .25s,box-shadow .25s;white-space:nowrap;
    }
    .btn-lookup:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(185,59,86,0.4);}
    .session-note{margin-top:14px;font-size:11.5px;color:rgba(255,255,255,0.4);letter-spacing:.5px;}
    .session-note b{color:var(--gold);}

    .app-card{
      background:rgba(255,255,255,0.03);border:1px solid rgba(200,155,44,0.15);border-radius:14px;
      padding:26px 28px;margin-bottom:18px;transition:border-color .25s;
    }
    .app-card:hover{border-color:rgba(200,155,44,0.35);}
    .app-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:14px;}
    .app-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#fff;}
    .app-cat{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-top:3px;}
    .app-ref{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:1px;margin-top:6px;}

    .status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:50px;font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;flex-shrink:0;}
    .status-pending{background:rgba(200,155,44,0.12);color:var(--gold-light);border:1px solid rgba(200,155,44,0.4);}
    .status-approved{background:rgba(76,175,80,0.12);color:#6fcf73;border:1px solid rgba(76,175,80,0.4);}
    .status-rejected{background:rgba(185,59,86,0.12);color:#e07a8f;border:1px solid rgba(185,59,86,0.4);}

    .app-meta{display:flex;flex-wrap:wrap;gap:20px;font-size:12px;color:rgba(255,255,255,0.55);border-top:1px solid rgba(200,155,44,0.1);padding-top:14px;margin-top:6px;}
    .app-meta span i{color:var(--rose);margin-right:6px;width:14px;}
    .app-desc{font-size:12.5px;color:rgba(255,255,255,0.45);margin-top:12px;line-height:1.6;}

    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.4);}
    .empty-state i{font-size:38px;color:rgba(200,155,44,0.35);margin-bottom:16px;display:block;}
    .empty-state p{font-size:13px;letter-spacing:.5px;}
    .empty-state a{color:var(--gold);text-decoration:none;font-weight:600;}
  </style>
</head>
<body>

<div id="nav-container"></div>

<section class="ma-header">
  <div class="container" style="position:relative;z-index:2;">
    <div class="ma-badge"><i class="fa-solid fa-store"></i> Vendor Portal</div>
    <h1>My<span>Applications</span></h1>
    <p class="ma-sub">Track the status of the vendor listings you've submitted to Wed Dream.</p>
  </div>
</section>

<section class="lookup-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9 col-xl-8">

        <div class="lookup-card">
          <div class="lookup-title"><i class="fa-solid fa-magnifying-glass"></i> Find Your Applications</div>
          <div class="lookup-row">
            <input type="text" class="form-control" id="lookupInput" placeholder="Enter the email you used when applying"/>
            <button class="btn-lookup" id="lookupBtn"><i class="fa-solid fa-search"></i> Search</button>
          </div>
          <div class="session-note" id="sessionNote"></div>
        </div>

        <div class="lookup-card" id="notLoggedInCard" style="display:none;">
          <div class="lookup-title"><i class="fa-solid fa-triangle-exclamation" style="color:var(--rose);"></i> Not Logged In</div>
          <p style="font-size:13px;color:rgba(255,255,255,0.55);margin:0;">You are not logged in to our website. Please login to view your applications.</p>
        </div>

        <div id="resultsContainer"></div>

      </div>
    </div>
  </div>
</section>

<div id="footer-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(() => {
  $.get('navebar.html', data => {
    $('#nav-container').html(data);
    $('.wd-menu-link').removeClass('active');
    $('.wd-mobile-list > li > a').removeClass('active');
  });
  $.get('footer.html', data => $('#footer-container').html(data));
});

const VENDORS_STORAGE_KEY = 'weddream_vendor_submissions';

function loadVendorSubmissions() {
  try { return JSON.parse(localStorage.getItem(VENDORS_STORAGE_KEY)) || []; }
  catch (err) { console.error('Could not read stored vendor submissions:', err); return []; }
}

function wdGetSession() {
  try { return JSON.parse(localStorage.getItem('wd_session') || 'null'); }
  catch (err) { return null; }
}

function statusBadge(status) {
  const map = {
    pending:  { cls:'status-pending',  icon:'fa-clock',        label:'Under Review' },
    approved: { cls:'status-approved', icon:'fa-circle-check', label:'Approved' },
    rejected: { cls:'status-rejected', icon:'fa-circle-xmark', label:'Rejected' }
  };
  const s = map[status] || map.pending;
  return `<span class="status-badge ${s.cls}"><i class="fa-solid ${s.icon}"></i>${s.label}</span>`;
}

function formatDate(iso) {
  try {
    return new Date(iso).toLocaleDateString('en-PK', { day:'numeric', month:'short', year:'numeric' });
  } catch { return iso; }
}

function renderResults(apps) {
  const container = document.getElementById('resultsContainer');
  if (!apps.length) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-inbox"></i>
        <p>No applications found for your account.<br>
        <a href="vendorsAdd.html">Submit a new vendor application →</a></p>
      </div>`;
    return;
  }
  container.innerHTML = apps.map(app => `
    <div class="app-card">
      <div class="app-top">
        <div>
          <div class="app-name">${app.name}</div>
          <div class="app-cat">${app.category} · ${app.area}</div>
          <div class="app-ref">Ref #${app.id} · Submitted ${formatDate(app.submitted_at)}</div>
        </div>
        ${statusBadge(app.status)}
      </div>
      <div class="app-meta">
        <span><i class="fa-solid fa-phone"></i>${app.phone || '—'}</span>
        <span><i class="fa-solid fa-envelope"></i>${app.contactEmail || '—'}</span>
        <span><i class="fa-solid fa-money-bill"></i>PKR ${Number(app.starting_price || 0).toLocaleString()}</span>
      </div>
      <div class="app-desc">${app.description || ''}</div>
    </div>
  `).join('');
}

function runLookup(email) {
  const all = loadVendorSubmissions();
  const matches = email
    ? all.filter(a => (a.contactEmail || '').toLowerCase() === email.toLowerCase())
    : [];
  renderResults(matches);
}

document.getElementById('lookupBtn').addEventListener('click', () => {
  const session = wdGetSession();
  if (!session) {
    document.getElementById('notLoggedInCard').style.display = 'block';
    document.getElementById('resultsContainer').innerHTML = '';
    return;
  }
  document.getElementById('notLoggedInCard').style.display = 'none';

  const val = document.getElementById('lookupInput').value.trim();
  if (!val) { document.getElementById('lookupInput').focus(); return; }
  runLookup(val);
});
document.getElementById('lookupInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('lookupBtn').click();
});

// On load: if logged in, prefill with the account's own email and auto-search;
// if not, leave the search box empty (search button will show the login message).
(function init() {
  const session = wdGetSession();
  if (session) {
    document.getElementById('sessionNote').innerHTML = `Showing results for your logged-in account: <b>${session.email}</b>`;
    document.getElementById('lookupInput').value = session.email;
    runLookup(session.email);
  } else {
    renderResults([]);
  }
})();
</script>
</body>
</html>
