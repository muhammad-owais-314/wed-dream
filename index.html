<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WedDream Navbar</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="MDB5-STANDARD-UI-KIT-Free-9.3.0 (2)/css/mdb.min.css">

</head>

<body>


<!-- ================= NAVEBAR ================= -->
 <div id="nav-container"></div>

<!-- ================= HERO ================= -->

<section id="hero" class="hero">

 

  <!-- Hero Content -->
  <div class="hero-content">

    <p class="hero-eyebrow fade-up delay-1">
      ✦ WE PLANE YOUR ✦
    </p>

    <h1 class="hero-title fade-up delay-2">
      Dream Wedding
    </h1>

    <p class="hero-subtitle fade-up delay-3">
      From intimate ceremonies to grand celebrations,
      we create unforgettable moments filled with elegance,
      emotions and timeless memories.
    </p>

    <!-- Buttons -->
    <div class="hero-buttons fade-up delay-4">

      <button class="btn-rose">
        <i class="fa-solid fa-heart"></i>
        Plan Your Wedding
      </button>

      <button class="btn-outline">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        AI Planner
      </button>

    </div>

    <!-- Search -->
    <div class="hero-search-wrap fade-up delay-5">

      <div class="search-bar">

        <i class="fa-solid fa-magnifying-glass search-icon"></i>

        <input
          type="text"
          placeholder="Search wedding halls, photographers, caterers..."
        >

        <button>Explore</button>

      </div>

    </div>

  </div>

</section>




<!-- ================= FOOTER ================= -->
 <div id="footer-container"></div>



 <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="MDB5-STANDARD-UI-KIT-Free-9.3.0 (2)/js/mdb.umd.min.js"></script>
<script src="script.js"></script>
</html>
