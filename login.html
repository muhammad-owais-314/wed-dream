<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WeDream – Sign In</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --rose:#b93b56;
  --rose-hover:#a22f49;
  --gold:#c89b2c;
  --gold-light:#e8b93c;
  --white:#ffffff;
  --white-light:rgba(255,255,255,0.72);
  --white-dim:rgba(255,255,255,0.35);
  --glass:rgba(15,10,14,0.55);
  --dark:#070707;
  --dark2:#0f0a0e;
  --dark3:#1a1118;
  --border:rgba(200,155,44,0.3);
  --border-focus:rgba(200,155,44,0.8);
  --error:#e05c5c;
  --success:#4caf82;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--dark);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 55% 40% at 80% 20%, rgba(200,155,44,0.07) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 20% 80%, rgba(185,59,86,0.07) 0%,transparent 60%);
  pointer-events:none;z-index:0;
}
.sparkle{
  position:fixed;color:var(--gold);opacity:0.2;font-size:20px;
  animation:twinkle 3s ease-in-out infinite;z-index:0;pointer-events:none;
}
.sparkle.s1{top:12%;left:6%;animation-delay:0.3s;}
.sparkle.s2{top:18%;right:8%;color:var(--rose);animation-delay:1.2s;font-size:16px;}
.sparkle.s3{bottom:12%;right:6%;animation-delay:0.8s;}
.sparkle.s4{bottom:22%;left:10%;animation-delay:2s;font-size:14px;}
@keyframes twinkle{
  0%,100%{opacity:0.1;transform:scale(1) rotate(0deg);}
  50%{opacity:0.35;transform:scale(1.3) rotate(20deg);}
}

.auth-card{
  background:var(--dark2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:44px 40px 36px;
  width:100%;max-width:440px;
  position:relative;z-index:1;
  animation:slideUp 0.5s ease both;
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}

.brand{text-align:center;margin-bottom:28px;}
.brand-logo{
  font-family:'Playfair Display',serif;
  font-size:26px;color:var(--gold);letter-spacing:1px;
}
.brand-logo span{color:var(--rose);}
.brand-tagline{
  font-size:12px;color:var(--white-dim);margin-top:4px;
  letter-spacing:1.5px;text-transform:uppercase;
}

.auth-heading{
  font-family:'Playfair Display',serif;
  font-size:22px;color:var(--white);
  text-align:center;margin-bottom:6px;
}
.auth-sub{
  font-size:13px;color:var(--white-dim);
  text-align:center;margin-bottom:28px;
}

.fg{margin-bottom:18px;position:relative;}
.fg label{
  display:block;font-size:12px;font-weight:500;
  color:var(--white-light);margin-bottom:6px;
  letter-spacing:0.5px;text-transform:uppercase;
}
.input-wrap{position:relative;}
.input-wrap i.icon-left{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--gold);font-size:16px;pointer-events:none;
}
.input-wrap i.icon-right{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--white-dim);font-size:16px;cursor:pointer;
  transition:color 0.2s;z-index:2;
}
.input-wrap i.icon-right:hover{color:var(--gold);}
.fg input{
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  padding:12px 14px 12px 42px;
  outline:none;
  transition:border-color 0.25s,background 0.25s,box-shadow 0.25s;
}
.fg input.has-right{padding-right:42px;}
.fg input::placeholder{color:var(--white-dim);}
.fg input:focus{
  border-color:var(--border-focus);
  background:rgba(200,155,44,0.05);
  box-shadow:0 0 0 3px rgba(200,155,44,0.1);
}
.fg input.error-field{
  border-color:var(--error);
  box-shadow:0 0 0 3px rgba(224,92,92,0.12);
}

.field-msg{
  font-size:11.5px;margin-top:5px;padding-left:2px;
  display:none;align-items:center;gap:4px;
}
.field-msg.show{display:flex;}
.field-msg.err{color:var(--error);}

.forgot-row{
  display:flex;justify-content:flex-end;
  margin-top:-10px;margin-bottom:18px;
}
.forgot-row a{
  font-size:12px;color:var(--gold);text-decoration:none;
}
.forgot-row a:hover{text-decoration:underline;}

/* Remember me */
.remember-row{
  display:flex;align-items:center;gap:8px;margin-bottom:20px;
}
.remember-row input[type=checkbox]{
  width:15px;height:15px;accent-color:var(--gold);cursor:pointer;
}
.remember-row label{
  font-size:13px;color:var(--white-dim);cursor:pointer;
}

.btn-submit{
  width:100%;background:var(--gold);border:none;border-radius:10px;
  color:var(--dark);font-family:'DM Sans',sans-serif;
  font-size:15px;font-weight:700;padding:14px;cursor:pointer;
  transition:background 0.2s,transform 0.15s,box-shadow 0.2s;
  letter-spacing:0.3px;position:relative;overflow:hidden;
}
.btn-submit::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.12) 0%,transparent 60%);
  pointer-events:none;
}
.btn-submit:hover:not(:disabled){
  background:var(--gold-light);transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(200,155,44,0.3);
}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;}
.btn-submit .spinner{
  display:none;width:18px;height:18px;
  border:2px solid rgba(0,0,0,0.2);border-top-color:var(--dark);
  border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* Error banner */
.err-banner{
  background:rgba(224,92,92,0.1);border:1px solid rgba(224,92,92,0.3);
  border-radius:10px;padding:12px 16px;
  color:var(--error);font-size:13px;
  display:none;align-items:center;gap:10px;margin-bottom:18px;
}
.err-banner.show{display:flex;}

.divider{
  display:flex;align-items:center;gap:12px;margin:18px 0;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
}
.divider span{font-size:12px;color:var(--white-dim);}

.auth-footer{
  text-align:center;margin-top:18px;
  font-size:13px;color:var(--white-dim);
}
.auth-footer a{color:var(--rose);text-decoration:none;font-weight:500;}
.auth-footer a:hover{text-decoration:underline;}

/* Attempt counter badge */
.attempt-badge{
  text-align:center;font-size:12px;
  color:var(--error);margin-bottom:12px;
  display:none;
}

.toast-wrap{
  position:fixed;top:24px;right:24px;z-index:9999;
  display:flex;flex-direction:column;gap:10px;
}
.toast{
  background:var(--dark3);border-left:3px solid var(--gold);
  border-radius:10px;padding:14px 18px;color:var(--white);
  font-size:13.5px;min-width:240px;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
  display:flex;align-items:center;gap:10px;
  animation:toastIn 0.35s ease both;
}
.toast.err-toast{border-left-color:var(--error);}
.toast.ok-toast{border-left-color:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* Locked state */
.locked-msg{
  text-align:center;font-size:13px;color:var(--error);
  background:rgba(224,92,92,0.08);border-radius:8px;
  padding:10px;margin-bottom:14px;display:none;
}
.locked-msg.show{display:block;}

@media(max-width:480px){
  .auth-card{padding:32px 20px 28px;}
}
</style>
</head>
<body>

<span class="sparkle s1">✦</span>
<span class="sparkle s2">✦</span>
<span class="sparkle s3">✦</span>
<span class="sparkle s4">✦</span>

<div class="toast-wrap" id="toastWrap"></div>

<div class="auth-card">
  <div class="brand">
    <div class="brand-logo">We<span>Dream</span></div>
    <div class="brand-tagline">Your Perfect Wedding Awaits</div>
  </div>

  <h2 class="auth-heading">Welcome Back</h2>
  <p class="auth-sub">Sign in to continue planning your perfect wedding</p>

  <!-- Error banner -->
  <div class="err-banner" id="errBanner">
    <i class="bi bi-exclamation-triangle-fill" style="font-size:16px;flex-shrink:0;"></i>
    <span id="errBannerText"></span>
  </div>

  <!-- Locked message -->
  <div class="locked-msg" id="lockedMsg"></div>

  <!-- Attempt counter -->
  <div class="attempt-badge" id="attemptBadge"></div>

  <form id="loginForm" novalidate>
    <!-- Email -->
    <div class="fg" id="fg-lemail">
      <label for="lemail">Email Address</label>
      <div class="input-wrap">
        <i class="bi bi-envelope icon-left"></i>
        <input type="email" id="lemail" placeholder="its.owaisansari314@gmail.com" autocomplete="email"/>
      </div>
      <div class="field-msg err" id="err-lemail"><i class="bi bi-x-circle-fill"></i><span></span></div>
    </div>

    <!-- Password -->
    <div class="fg" id="fg-lpassword">
      <label for="lpassword">Password</label>
      <div class="input-wrap">
        <i class="bi bi-lock icon-left"></i>
        <input type="password" id="lpassword" placeholder="Your password" class="has-right" autocomplete="current-password"/>
        <i class="bi bi-eye icon-right" id="toggleLpass" title="Show/hide password"></i>
      </div>
      <div class="field-msg err" id="err-lpassword"><i class="bi bi-x-circle-fill"></i><span></span></div>
    </div>



    <button type="submit" class="btn-submit" id="loginBtn">
      <span id="loginBtnText">Sign In</span>
      <div class="spinner" id="loginSpinner"></div>
    </button>

  </form>

  <div class="divider"><span>New to WeDream?</span></div>
  <div class="auth-footer">
    <a href="signup.html"><i class="bi bi-person-plus"></i> Create an Account</a>
  </div>
</div>

<script>
// ─── Constants ─────────────────────────
const MAX_ATTEMPTS = 5;
const LOCK_DURATION = 5 * 60 * 1000;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

// ─── Toast ─────────────────────────────
function showToast(msg, type='ok'){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className='toast '+(type==='err'?'err-toast':'ok-toast');

  t.innerHTML = `
    <i class="bi ${type==='err'?'bi-x-circle':'bi-check-circle'}"
    style="color:${type==='err'?'#e05c5c':'#4caf82'};font-size:18px"></i>
    ${msg}
  `;

  wrap.appendChild(t);

  setTimeout(()=>{
    t.style.opacity='0';
    t.style.transition='opacity 0.4s';
    setTimeout(()=>t.remove(),400);
  },3500);
}

// ─── Errors ────────────────────────────
function showErr(id, msg){
  const el = document.getElementById('err-'+id);
  const inp = document.getElementById(id);

  if(!el || !inp) return;

  el.querySelector('span').textContent = msg;
  el.classList.add('show');
  inp.classList.add('error-field');
}

function clearErr(id){
  const el = document.getElementById('err-'+id);
  const inp = document.getElementById(id);

  if(!el || !inp) return;

  el.classList.remove('show');
  inp.classList.remove('error-field');
}

function showBanner(msg){
  const b = document.getElementById('errBanner');
  document.getElementById('errBannerText').textContent = msg;
  b.classList.add('show');
}

function hideBanner(){
  document.getElementById('errBanner').classList.remove('show');
}

// ─── Lock System ───────────────────────
function getAttemptData(){
  return JSON.parse(localStorage.getItem('wd_login_attempts')||'{"count":0,"lockedUntil":0}');
}

function saveAttemptData(d){
  localStorage.setItem('wd_login_attempts',JSON.stringify(d));
}

function resetAttempts(){
  saveAttemptData({count:0,lockedUntil:0});
}

function isLocked(){
  const d = getAttemptData();

  if(d.lockedUntil && Date.now() < d.lockedUntil){
    return d.lockedUntil;
  }

  if(d.lockedUntil && Date.now() >= d.lockedUntil){
    resetAttempts();
  }

  return false;
}

function checkLock(){
  const until = isLocked();
  const locked = document.getElementById('lockedMsg');
  const btn = document.getElementById('loginBtn');

  if(until){
    const mins = Math.ceil((until - Date.now())/60000);
    locked.textContent = `Too many attempts. Try again in ${mins} min.`;
    locked.classList.add('show');
    btn.disabled = true;
    return true;
  }

  locked.classList.remove('show');
  btn.disabled = false;
  return false;
}

// ─── Badge ─────────────────────────────
function updateAttemptBadge(){
  const d = getAttemptData();
  const badge = document.getElementById('attemptBadge');

  if(d.count>0 && d.count<MAX_ATTEMPTS){
    badge.textContent = `${MAX_ATTEMPTS - d.count} attempts left`;
    badge.style.display='block';
  } else {
    badge.style.display='none';
  }
}

// ─── Password Toggle ───────────────────
document.getElementById('toggleLpass').addEventListener('click',function(){
  const inp = document.getElementById('lpassword');
  const show = inp.type==='password';

  inp.type = show?'text':'password';
  this.className = show ? 'bi bi-eye-slash icon-right' : 'bi bi-eye icon-right';
});

// ─── Input Clear Errors ────────────────
document.getElementById('lemail').addEventListener('input',()=>{ clearErr('lemail'); hideBanner(); });
document.getElementById('lpassword').addEventListener('input',()=>{ clearErr('lpassword'); hideBanner(); });

// ─── Validation ────────────────────────
function validateLogin(){
  let valid = true;

  const email = document.getElementById('lemail').value.trim();
  const pass  = document.getElementById('lpassword').value;

  if(!email){
    showErr('lemail','Email required');
    valid=false;
  } else if(!EMAIL_RE.test(email)){
    showErr('lemail','Invalid email');
    valid=false;
  } else clearErr('lemail');

  if(!pass){
    showErr('lpassword','Password required');
    valid=false;
  } else clearErr('lpassword');

  return valid;
}

// ─── Submit FIXED ──────────────────────
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  hideBanner();

  if(checkLock()) return;
  if(!validateLogin()) return;

  const email = document.getElementById('lemail').value.trim().toLowerCase();
  const pass  = document.getElementById('lpassword').value;

  const btn = document.getElementById('loginBtn');
  const txt = document.getElementById('loginBtnText');
  const spin = document.getElementById('loginSpinner');

  txt.style.display='none';
  spin.style.display='block';
  btn.disabled=true;

  setTimeout(()=>{

    const users = JSON.parse(localStorage.getItem('wd_users')||'[]');
    const user = users.find(u => u.email === email);

    if(!user){
      txt.style.display='block';
      spin.style.display='none';
      btn.disabled=false;

      const d = getAttemptData();
      d.count++;
      if(d.count >= MAX_ATTEMPTS){
        d.lockedUntil = Date.now() + LOCK_DURATION;
      }
      saveAttemptData(d);

      updateAttemptBadge();
      checkLock();

      showErr('lemail','Not registered');
      showBanner('Account not found');
      showToast('User not found','err');
      return;
    }

    if(atob(user.password) !== pass){
      txt.style.display='block';
      spin.style.display='none';
      btn.disabled=false;

      const d = getAttemptData();
      d.count++;
      if(d.count >= MAX_ATTEMPTS){
        d.lockedUntil = Date.now() + LOCK_DURATION;
      }
      saveAttemptData(d);

      updateAttemptBadge();
      checkLock();

      showErr('lpassword','Wrong password');
      showBanner('Incorrect password');
      showToast('Wrong password','err');
      return;
    }

    // ✅ SUCCESS
    resetAttempts();

    localStorage.setItem('wd_session', JSON.stringify({
      email: user.email,
      fname: user.fname,
      loggedInAt: new Date().toISOString()
    }));

    showToast(`Welcome ${user.fname}`,'ok');

    setTimeout(()=>{
      window.location.href='index.html';
    },1500);

  },800);
});

// init
checkLock();
updateAttemptBadge();
setInterval(()=>{ checkLock(); updateAttemptBadge(); },30000);
</script>
</body>
</html>
